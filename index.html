function renderCronogramaTabela(){
  const p = state.atual;
  const scroll = document.querySelector('[data-cronograma-scroll]');
  if(!scroll) return;

  const headerCols = [];
  for(let m=0;m<cronogramaNumMeses;m++) headerCols.push(`<th>${mesLabelCronograma(p,m)}</th>`);

  const rows = p.custos.map((c,i)=>{
    const cels = cronogramaGrid[i].map((v,m)=>`<td class="cel"><input type="text" inputmode="decimal" class="money-in" data-cg-row="${i}" data-cg-col="${m}" value="${fmtMoneyInput(v)}"></td>`).join('');
    const total = cronogramaGrid[i].reduce((s,n)=>s+(Number(n)||0),0);
    const valorItem = Number(c.valor)||0;
    const saldo = round2(valorItem - total);
    const diff = Math.round(total) !== Math.round(valorItem);
    return `<tr data-cg-linha="${i}">
      <td class="item-nome sticky-col1">${escapeHtml(c.item)}</td>
      <td class="row-valor sticky-col2" data-cg-valoritem="${i}">${fmtBRL(valorItem)}</td>
      <td class="row-total sticky-col3 ${diff?'neg':'pos'}" data-cg-rowtotal="${i}">${fmtBRL(total)}</td>
      <td class="row-total sticky-col4 ${saldo===0?'pos':(saldo>0?'warn':'neg')}" data-cg-rowsaldo="${i}">${fmtBRL(saldo)}</td>
      <td class="cel-acao sticky-col5"><button class="ghost small" data-cg-parcelar="${i}">Lançar</button></td>
      ${cels}
    </tr>`;
  }).join('');

  const totaisMes = [];
  for(let m=0;m<cronogramaNumMeses;m++){
    let soma = 0;
    cronogramaGrid.forEach(linha=>{ soma += Number(linha[m])||0; });
    totaisMes.push(soma);
  }
  const grandTotal = totaisMes.reduce((s,n)=>s+n,0);
  const totalOrcamento = p.custos.reduce((s,c)=>s+(Number(c.valor)||0),0);
  const saldoGeral = round2(totalOrcamento - grandTotal);
  const totalRowCels = totaisMes.map((v,m)=>`<td class="row-total" data-cg-coltotal="${m}">${fmtBRL(v)}</td>`).join('');

  scroll.innerHTML = `<table class="cronograma">
    <thead><tr>
      <th class="sticky-col1">Item / mês</th>
      <th class="sticky-col2">Valor definido</th>
      <th class="sticky-col3">Total lançado</th>
      <th class="sticky-col4">Saldo</th>
      <th class="sticky-col5"></th>
      ${headerCols}
    </tr></thead>
    <tbody>${rows}
      <tr class="total-row">
        <td class="item-nome sticky-col1">Total mensal</td>
        <td class="row-valor sticky-col2">${fmtBRL(totalOrcamento)}</td>
        <td class="row-total sticky-col3" data-cg-grandtotal="1">${fmtBRL(grandTotal)}</td>
        <td class="row-total sticky-col4 ${saldoGeral===0?'pos':(saldoGeral>0?'warn':'neg')}" data-cg-saldogeral="1">${fmtBRL(saldoGeral)}</td>
        <td class="sticky-col5"></td>
        ${totalRowCels}
      </tr>
    </tbody>
  </table>`;

  scroll.querySelectorAll('[data-cg-row]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const row = Number(el.getAttribute('data-cg-row'));
      const col = Number(el.getAttribute('data-cg-col'));
      cronogramaGrid[row][col] = parseMoneyBR(el.value);
      atualizarCronogramaTotais(row, col);
    });
    el.addEventListener('blur', ()=>{ el.value = fmtMoneyInput(parseMoneyBR(el.value)); });
    el.addEventListener('focus', ()=>{ el.select(); });
  });

  scroll.querySelectorAll('[data-cg-parcelar]').forEach(el=>{
    el.addEventListener('click', ()=>{
      abrirParcelarLinha(Number(el.getAttribute('data-cg-parcelar')));
    });
  });
}

function atualizarSaldoRestanteCronograma(){
  const p = state.atual;
  const el = document.querySelector('[data-cg-saldorestante]');
  if(!el) return;
  const totalOrcamento = p.custos.reduce((s,c)=>s+(Number(c.valor)||0),0);
  let lancado = 0;
  cronogramaGrid.forEach(linha=>linha.forEach(v=>{ lancado += Number(v)||0; }));
  const saldo = round2(totalOrcamento - lancado);
  el.textContent = fmtBRL(saldo);
  el.className = saldo===0?'pos':(saldo>0?'warn':'neg');
}

function atualizarCronogramaTotais(row, col){
  const p = state.atual;
  const valorItem = Number(p.custos[row].valor)||0;
  const total = cronogramaGrid[row].reduce((s,n)=>s+(Number(n)||0),0);
  const rowTotalEl = document.querySelector(`[data-cg-rowtotal="${row}"]`);
  if(rowTotalEl){
    const diff = Math.round(total) !== Math.round(valorItem);
    rowTotalEl.textContent = fmtBRL(total);
    rowTotalEl.className = `row-total sticky-col3 ${diff?'neg':'pos'}`;
  }
  const rowSaldoEl = document.querySelector(`[data-cg-rowsaldo="${row}"]`);
  if(rowSaldoEl){
    const saldo = round2(valorItem - total);
    rowSaldoEl.textContent = fmtBRL(saldo);
    rowSaldoEl.className = `row-total sticky-col4 ${saldo===0?'pos':(saldo>0?'warn':'neg')}`;
  }
  const colTotalEl = document.querySelector(`[data-cg-coltotal="${col}"]`);
  if(colTotalEl){
    let soma = 0;
    cronogramaGrid.forEach(linha=>{ soma += Number(linha[col])||0; });
    colTotalEl.textContent = fmtBRL(soma);
  }
  const grandTotalEl = document.querySelector('[data-cg-grandtotal]');
  let grandTotal = 0;
  cronogramaGrid.forEach(linha=>linha.forEach(v=>{ grandTotal += Number(v)||0; }));
  if(grandTotalEl) grandTotalEl.textContent = fmtBRL(grandTotal);
  const saldoGeralEl = document.querySelector('[data-cg-saldogeral]');
  if(saldoGeralEl){
    const totalOrcamento = p.custos.reduce((s,c)=>s+(Number(c.valor)||0),0);
    const saldoGeral = round2(totalOrcamento - grandTotal);
    saldoGeralEl.textContent = fmtBRL(saldoGeral);
    saldoGeralEl.className = `row-total sticky-col4 ${saldoGeral===0?'pos':(saldoGeral>0?'warn':'neg')}`;
  }
  atualizarSaldoRestanteCronograma();
}

function bindCronogramaEventosEstaticos(){
  document.querySelectorAll('[data-fechar-cronograma]').forEach(el=>{
    el.addEventListener('click', fecharModalCronograma);
  });

  const addMesBtn = document.querySelector('[data-cronograma-addmes]');
  if(addMesBtn) addMesBtn.addEventListener('click', ()=>{
    cronogramaNumMeses += 1;
    cronogramaGrid.forEach(linha=>linha.push(0));
    renderCronogramaTabela();
    atualizarSaldoRestanteCronograma();
  });

  const redistribuirBtn = document.querySelector('[data-cronograma-redistribuir]');
  if(redistribuirBtn) redistribuirBtn.addEventListener('click', ()=>{
    const p = state.atual;
    cronogramaGrid = p.custos.map(c=>distribuirIgualmenteMoeda(Number(c.valor)||0, cronogramaNumMeses));
    renderCronogramaTabela();
    atualizarSaldoRestanteCronograma();
  });

  const limparBtn = document.querySelector('[data-cronograma-limpar]');
  if(limparBtn) limparBtn.addEventListener('click', ()=>{
    cronogramaGrid = cronogramaGrid.map(linha=>linha.map(()=>0));
    renderCronogramaTabela();
    atualizarSaldoRestanteCronograma();
  });

  const nomeInput = document.querySelector('[data-cronograma-nome]');
  if(nomeInput) nomeInput.addEventListener('input', ()=>{ cronogramaNomeNovo = nomeInput.value; });

  const salvarCenarioBtn = document.querySelector('[data-cronograma-salvar-cenario]');
  if(salvarCenarioBtn) salvarCenarioBtn.addEventListener('click', async ()=>{
    const nome = (cronogramaNomeNovo||'').trim();
    if(!nome){ if(nomeInput){ nomeInput.style.borderColor='var(--bad)'; nomeInput.placeholder='Dê um nome ao cenário'; } return; }
    const p = state.atual;
    const itens = {};
    p.custos.forEach((c,i)=>{ itens[c.item] = [...cronogramaGrid[i]]; });
    const id = 'cd_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const cenario = { id, nome, itens };
    await salvarCenarioDespesasStorage(cenario);
    cronogramaCenarios.push({id, nome});
    await salvarListaCenariosDespesas(cronogramaCenarios);
    cronogramaNomeNovo = '';
    if(nomeInput) nomeInput.value = '';
    renderCronogramaCenariosLista();
  });

  const aplicarBtn = document.querySelector('[data-cronograma-aplicar]');
  if(aplicarBtn) aplicarBtn.addEventListener('click', async ()=>{
    state.atual.custos.forEach((c,i)=>{ c.cronograma = [...cronogramaGrid[i]]; });
    await salvarProjeto(state.atual);
    fecharModalCronograma();
    render();
  });
}

function renderCronogramaCenariosLista(){
  const wrap = document.querySelector('[data-cronograma-cenarios-lista]');
  if(!wrap) return;
  if(cronogramaCenarios.length===0){
    wrap.innerHTML = `<div class="footnote" style="margin:4px 0 8px;">Nenhum cenário salvo ainda.</div>`;
    return;
  }
  wrap.innerHTML = cronogramaCenarios.map(c=>`
    <div class="cenario-item">
      <span class="nome">${escapeHtml(c.nome)}</span>
      <span class="acoes">
        <button class="ghost small" data-cronograma-usar="${c.id}">Usar</button>
        <button class="ghost small" data-cronograma-apagar-cenario="${c.id}">Excluir</button>
      </span>
    </div>`).join('');

  wrap.querySelectorAll('[data-cronograma-usar]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-cronograma-usar');
      const cenario = await carregarCenarioDespesas(id);
      if(cenario && cenario.itens) aplicarCenarioDespesasNaGrade(cenario);
    });
  });
  wrap.querySelectorAll('[data-cronograma-apagar-cenario]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-cronograma-apagar-cenario');
      await apagarCenarioDespesasStorage(id);
      cronogramaCenarios = cronogramaCenarios.filter(c=>c.id!==id);
      renderCronogramaCenariosLista();
    });
  });
}

function aplicarCenarioDespesasNaGrade(cenario){
  const p = state.atual;
  let maxLen = cronogramaNumMeses;
  p.custos.forEach(c=>{
    const arr = cenario.itens[c.item];
    if(arr && arr.length>maxLen) maxLen = arr.length;
  });
  garantirColunasCronograma(maxLen);
  p.custos.forEach((c,i)=>{
    const arr = cenario.itens[c.item];
    if(arr){
      const linha = new Array(cronogramaNumMeses).fill(0);
      arr.forEach((v,idx)=>{ if(idx<cronogramaNumMeses) linha[idx] = Number(v)||0; });
      cronogramaGrid[i] = linha;
    }
  });
  renderCronogramaTabela();
  atualizarSaldoRestanteCronograma();
}

/* ---- Parcelar uma linha do cronograma (qtd de parcelas + mês inicial) ---- */
function garantirColunasCronograma(minColunas){
  while(cronogramaNumMeses < minColunas){
    cronogramaGrid.forEach(linha=>linha.push(0));
    cronogramaNumMeses += 1;
  }
}

function fecharParcelarLinha(){
  const overlay = document.querySelector('.modal-overlay-parcelar');
  if(overlay) overlay.remove();
}

function abrirParcelarLinha(rowIdx){
  fecharParcelarLinha();
  const p = state.atual;
  const item = p.custos[rowIdx];
  let modo = 'total';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay modal-overlay-parcelar';
  overlay.style.zIndex = '110';
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:400px;position:relative;">
      <div class="modal-header">
        <div><h2 style="font-size:16px;">Lançar valores — ${escapeHtml(item.item)}</h2>
        <div class="footnote" style="margin:2px 0 0;">Valor definido para o item: <strong>${fmtBRL(Number(item.valor)||0)}</strong></div></div>
        <button class="modal-close" data-fechar-parcelar="1">✕</button>
      </div>

      <div class="modo-toggle">
        <button type="button" class="modo-btn active" data-parcelar-modo="total">Dividir o valor total</button>
        <button type="button" class="modo-btn" data-parcelar-modo="mensal">Valor mensal fixo</button>
      </div>

      <div data-parcelar-campos style="margin-top:12px;"></div>
      <div class="footnote" data-parcelar-preview style="margin-top:6px;"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
        <button class="ghost" data-fechar-parcelar="1">Cancelar</button>
        <button class="primary" data-parcelar-confirmar="${rowIdx}">Aplicar na linha</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const camposWrap = overlay.querySelector('[data-parcelar-campos]');
  const preview = overlay.querySelector('[data-parcelar-preview]');

  function renderCampos(){
    if(modo==='total'){
      camposWrap.innerHTML = `
        <div class="field-row">
          <div class="field"><label>Quantidade de parcelas</label><input type="number" min="1" value="1" data-parcelar-qtd></div>
          <div class="field"><label>Mês inicial (nº desde o início da obra)</label><input type="number" min="1" value="1" data-parcelar-mesinicial></div>
        </div>`;
    } else {
      camposWrap.innerHTML = `
        <div class="field-row">
          <div class="field"><label>Valor mensal (R$)</label><input type="text" inputmode="decimal" class="money-in" value="${fmtMoneyInput(0)}" data-parcelar-valormensal></div>
          <div class="field"><label>Quantidade de meses</label><input type="number" min="1" value="1" data-parcelar-qtdmeses></div>
          <div class="field"><label>Mês inicial (nº desde o início da obra)</label><input type="number" min="1" value="1" data-parcelar-mesinicial2></div>
        </div>
        <div class="footnote">Se o total lançado ficar diferente do valor definido do item, a coluna "Saldo" vai indicar a diferença — ajuste o valor do item na tela de custos se quiser igualar.</div>`;
    }
    bindCampos();
    atualizarPreview();
  }

  function bindCampos(){
    if(modo==='total'){
      const qtdInput = overlay.querySelector('[data-parcelar-qtd]');
      const mesInput = overlay.querySelector('[data-parcelar-mesinicial]');
      qtdInput.addEventListener('input', atualizarPreview);
      mesInput.addEventListener('input', atualizarPreview);
    } else {
      const valorInput = overlay.querySelector('[data-parcelar-valormensal]');
      const qtdMesesInput = overlay.querySelector('[data-parcelar-qtdmeses]');
      const mesInput2 = overlay.querySelector('[data-parcelar-mesinicial2]');
      valorInput.addEventListener('input', atualizarPreview);
      valorInput.addEventListener('blur', ()=>{ valorInput.value = fmtMoneyInput(parseMoneyBR(valorInput.value)); });
      valorInput.addEventListener('focus', ()=>{ valorInput.select(); });
      qtdMesesInput.addEventListener('input', atualizarPreview);
      mesInput2.addEventListener('input', atualizarPreview);
    }
  }

  function atualizarPreview(){
    if(modo==='total'){
      const qtdInput = overlay.querySelector('[data-parcelar-qtd]');
      const mesInput = overlay.querySelector('[data-parcelar-mesinicial]');
      const qtd = Math.max(Number(qtdInput.value)||1,1);
      const mesInicial = Math.max(Number(mesInput.value)||1,1);
      const valorParcela = (Number(item.valor)||0)/qtd;
      const mesInicioLabel = mesLabelCronograma(p, mesInicial-1);
      const mesFimLabel = mesLabelCronograma(p, mesInicial-2+qtd);
      preview.innerHTML = `${qtd}x de <strong>${fmtBRL(valorParcela)}</strong>, de ${mesInicioLabel} a ${mesFimLabel}. Isso substitui os valores já lançados nessa linha.`;
    } else {
      const valorInput = overlay.querySelector('[data-parcelar-valormensal]');
      const qtdMesesInput = overlay.querySelector('[data-parcelar-qtdmeses]');
      const mesInput2 = overlay.querySelector('[data-parcelar-mesinicial2]');
      const valorMensal = parseMoneyBR(valorInput.value);
      const qtdMeses = Math.max(Number(qtdMesesInput.value)||1,1);
      const mesInicial = Math.max(Number(mesInput2.value)||1,1);
      const mesInicioLabel = mesLabelCronograma(p, mesInicial-1);
      const mesFimLabel = mesLabelCronograma(p, mesInicial-2+qtdMeses);
      const total = valorMensal*qtdMeses;
      preview.innerHTML = `${fmtBRL(valorMensal)} por mês, de ${mesInicioLabel} a ${mesFimLabel} — total lançado: <strong>${fmtBRL(total)}</strong>. Isso substitui os valores já lançados nessa linha.`;
    }
  }

  overlay.querySelectorAll('[data-parcelar-modo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modo = btn.getAttribute('data-parcelar-modo');
      overlay.querySelectorAll('[data-parcelar-modo]').forEach(b=>b.classList.toggle('active', b===btn));
      renderCampos();
    });
  });

  renderCampos();

  overlay.querySelectorAll('[data-fechar-parcelar]').forEach(el=>el.addEventListener('click', fecharParcelarLinha));

  overlay.querySelector('[data-parcelar-confirmar]').addEventListener('click', ()=>{
    let mesInicial, valores;
    if(modo==='total'){
      const qtd = Math.max(Number(overlay.querySelector('[data-parcelar-qtd]').value)||1,1);
      mesInicial = Math.max(Number(overlay.querySelector('[data-parcelar-mesinicial]').value)||1,1);
      garantirColunasCronograma(mesInicial-1+qtd);
      valores = distribuirIgualmenteMoeda(Number(item.valor)||0, qtd);
    } else {
      const valorMensal = parseMoneyBR(overlay.querySelector('[data-parcelar-valormensal]').value);
      const qtdMeses = Math.max(Number(overlay.querySelector('[data-parcelar-qtdmeses]').value)||1,1);
      mesInicial = Math.max(Number(overlay.querySelector('[data-parcelar-mesinicial2]').value)||1,1);
      garantirColunasCronograma(mesInicial-1+qtdMeses);
      valores = new Array(qtdMeses).fill(valorMensal);
    }
    cronogramaGrid[rowIdx] = cronogramaGrid[rowIdx].map(()=>0);
    valores.forEach((v,i)=>{ cronogramaGrid[rowIdx][mesInicial-1+i] = v; });
    fecharParcelarLinha();
    renderCronogramaTabela();
    atualizarSaldoRestanteCronograma();
  });
}

function renderTabelaFluxo(serie){
  const linhas = serie.map((s,i)=>{
    const temDetalhe = (s.detEntradas&&s.detEntradas.length) || (s.detSaidas&&s.detSaidas.length);
    const entradaTotal = (s.detEntradas||[]).filter(d=>d.label.startsWith('Entrada')).reduce((sm,d)=>sm+d.valor,0);
    const investidorTotal = (s.detEntradas||[]).filter(d=>d.label==='Receita de investidores').reduce((sm,d)=>sm+d.valor,0);
    const saldoTotal = (s.detEntradas||[]).filter(d=>!d.label.startsWith('Entrada') && d.label!=='Receita de investidores').reduce((sm,d)=>sm+d.valor,0);
    const detalheHtml = temDetalhe ? `
      <tr class="fluxo-detalhe-row" data-fluxo-detalhe="${i}" style="display:none;">
        <td colspan="5">
          <div class="fluxo-detalhe">
            <div class="fluxo-detalhe-col">
              <div class="fluxo-detalhe-titulo">Entradas lançadas</div>
              ${entradaTotal>0 ? `<div class="fluxo-detalhe-item"><span>Entrada</span><span class="pos">${fmtBRL(entradaTotal)}</span></div>` : ''}
              ${saldoTotal>0 ? `<div class="fluxo-detalhe-item"><span>Saldo parcelado</span><span class="pos">${fmtBRL(saldoTotal)}</span></div>` : ''}
              ${investidorTotal>0 ? `<div class="fluxo-detalhe-item"><span>Receita de investidores</span><span class="pos">${fmtBRL(investidorTotal)}</span></div>` : ''}
              ${(entradaTotal<=0 && saldoTotal<=0 && investidorTotal<=0) ? '<div class="fluxo-detalhe-vazio">Nenhuma entrada neste mês.</div>' : ''}
            </div>
            <div class="fluxo-detalhe-col">
              <div class="fluxo-detalhe-titulo">Saídas lançadas</div>
              ${s.detSaidas.length ? s.detSaidas.map(d=>`<div class="fluxo-detalhe-item"><span>${escapeHtml(d.label)}</span><span class="neg">${fmtBRL(d.valor)}</span></div>`).join('') : '<div class="fluxo-detalhe-vazio">Nenhuma saída neste mês.</div>'}
            </div>
          </div>
        </td>
      </tr>` : '';
    return `<tr class="fluxo-mes-row" data-fluxo-mes="${i}">
      <td>${fmtMesAno(new Date(s.mes))} <i class="seta">▸</i></td>
      <td class="num pos">${s.entrada>0?fmtBRL(s.entrada):'—'}</td>
      <td class="num neg">${s.saida>0?fmtBRL(s.saida):'—'}</td>
      <td class="num ${s.liquido>=0?'pos':'neg'}">${fmtBRL(s.liquido)}</td>
      <td class="num ${s.acumulado>=0?'pos':'neg'}"><strong>${fmtBRL(s.acumulado)}</strong></td>
    </tr>${detalheHtml}`;
  }).join('');
  return `<div class="fluxo-table-scroll">
    <table class="costs fluxo-table" data-fluxo-tabela="1">
      <thead><tr><th>Mês</th><th class="num">Entrada</th><th class="num">Saída</th><th class="num">Líquido</th><th class="num">Acumulado</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>
  </div>`;
}

function renderChart(serie){
  if(!serie.length) return '';
  const W = 900, H = 260, padL=44, padR=10, padT=10, padB=28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = serie.length;
  const barW = Math.max(plotW/n*0.62, 1.5);
  const maxFlow = Math.max(1, ...serie.map(s=>Math.max(s.entrada,s.saida)));
  const minAcc = Math.min(0, ...serie.map(s=>s.acumulado));
  const maxAcc = Math.max(0, ...serie.map(s=>s.acumulado));
  const yFlow = v => plotT() + plotH*0.62 - (v/maxFlow)*(plotH*0.6);
  function plotT(){ return padT; }
  const baseY = padT + plotH*0.62;
  const yAcc = v => padT + plotH - ((v-minAcc)/((maxAcc-minAcc)||1))*plotH;

  const step = plotW/n;
  let bars='';
  serie.forEach((s,i)=>{
    const x = padL + i*step + (step-barW)/2;
    if(s.entrada>0){
      const h = (s.entrada/maxFlow)*(plotH*0.6);
      bars += `<rect x="${x}" y="${baseY-h}" width="${barW/2}" height="${h}" fill="var(--steel)" opacity="0.85"/>`;
    }
    if(s.saida>0){
      const h = (s.saida/maxFlow)*(plotH*0.6);
      bars += `<rect x="${x+barW/2}" y="${baseY}" width="${barW/2}" height="${h}" fill="var(--brick)" opacity="0.85"/>`;
    }
  });

  let path='';
  serie.forEach((s,i)=>{
    const x = padL + i*step + step/2;
    const y = yAcc(s.acumulado);
    path += (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1)+' ';
  });

  const zeroY = yAcc(0);
  const labelEvery = Math.ceil(n/10);
  let labels='';
  serie.forEach((s,i)=>{
    if(i%labelEvery===0){
      const x = padL + i*step + step/2;
      labels += `<text x="${x}" y="${H-8}" font-size="9.5" fill="var(--ink-soft)" text-anchor="middle">${fmtMesAno(new Date(s.mes))}</text>`;
    }
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
    <line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--line-soft)" stroke-width="1"/>
    ${bars}
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>
    ${labels}
  </svg>`;
}

function recomputeTerreno(p){
  const t = p.terreno;
  const sinal = Number(t.sinal)||0, permuta = Number(t.permuta)||0, outros = Number(t.outrosCustos)||0;
  const qtd = Number(t.qtdParcelas)||0;
  if(t.modo==='auto_parcela'){
    const total = Number(t.valorCompra)||0;
    const restante = total - sinal - permuta - outros;
    t.valorParcela = qtd>0 ? restante/qtd : 0;
  } else {
    const parcela = Number(t.valorParcela)||0;
    t.valorCompra = sinal + qtd*parcela + permuta + outros;
  }
}

function hintEntradaHTML(p, r){
  const entradaPct = Number(p.vendas.condicao.entradaPct)||0;
  const entradaParcelas = Math.max(Number(p.vendas.condicao.entradaParcelas)||1,1);
  const entradaTotal = r.receitaLiquida * entradaPct/100;
  const entradaPorLote = r.precoDiretaLiquido * entradaPct/100;
  const entradaPorLoteParcela = entradaPorLote/entradaParcelas;
  const parcelaTotal = entradaTotal/entradaParcelas;
  const temDesconto = r.impostos>0 || (r.comissaoAbatida && r.comissaoValor>0);
  return `Entrada total: <strong>${fmtBRL(entradaTotal)}</strong> (<strong>${fmtBRL(entradaPorLote)}</strong> por lote)`
    + (entradaParcelas>1
        ? ` — ${entradaParcelas}x de <strong>${fmtBRL(parcelaTotal)}</strong> (<strong>${fmtBRL(entradaPorLoteParcela)}</strong> por lote)`
        : '')
    + `, recebida a partir do início das vendas.`
    + (temDesconto ? ` Valores já líquidos de impostos${r.comissaoAbatida?' e comissão':''}, iguais aos que aparecem no fluxo de caixa.` : '');
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bindEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-open]').forEach(el=>{

      if(e.target.closest('[data-del]') || e.target.closest('[data-export]') || e.target.closest('[data-relatorio]') || e.target.closest('[data-compare]') || e.target.closest('.card-compare')) return;

      state.atual = p; state.view='editor'; render();
    });
  });
  app.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-del');
      if(!(await confirmarAcao('Excluir este projeto? Essa ação não pode ser desfeita.'))) return;
      await apagarProjeto(id);
      state.projetos = state.projetos.filter(x=>x.id!==id);
      projetosComparar.delete(id);
      render();
      mostrarAviso('Projeto excluído.', 'sucesso');
    });
  });
  app.querySelectorAll('[data-export]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-export');
      const p = state.projetos.find(x=>x.id===id) || state.atual;
      if(p) exportarProjetoArquivo(p);
    });
  });
  app.querySelectorAll('[data-relatorio]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-relatorio');
      const p = state.projetos.find(x=>x.id===id) || state.atual;
      if(p) abrirRelatorio(p);
    });
  });
  const exportAllBtn = app.querySelector('[data-export-all]');
  if(exportAllBtn) exportAllBtn.addEventListener('click', exportarTodosProjetos);

  const logoutBtn = app.querySelector('[data-logout]');
  if(logoutBtn) logoutBtn.addEventListener('click', async ()=>{
    if(!(await confirmarAcao('Sair do sistema?'))) return;
    await supabaseClient.auth.signOut();
    mostrarLogin();
  });

  const trocarSenhaBtn = app.querySelector('[data-trocar-senha]');
  if(trocarSenhaBtn) trocarSenhaBtn.addEventListener('click', async ()=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.zIndex = '200';
    overlay.innerHTML = `
      <div class="modal-box" style="max-width:340px;">
        <h2 style="font-size:16px;margin:0 0 12px;">Trocar senha</h2>
        <div class="field" style="margin-bottom:14px;">
          <label>Nova senha</label>
          <input type="password" id="novaSenhaInput" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="footnote" id="trocarSenhaAviso" style="margin-bottom:10px;"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="ghost" id="trocarSenhaCancelar">Cancelar</button>
          <button class="primary" id="trocarSenhaConfirmar">Salvar nova senha</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#trocarSenhaCancelar').addEventListener('click', ()=>overlay.remove());
    overlay.querySelector('#trocarSenhaConfirmar').addEventListener('click', async ()=>{
      const nova = overlay.querySelector('#novaSenhaInput').value;
      const aviso = overlay.querySelector('#trocarSenhaAviso');
      if(nova.length<6){ aviso.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; aviso.style.color='var(--bad)'; return; }
      const { error } = await supabaseClient.auth.updateUser({ password: nova });
      if(error){ aviso.textContent = 'Não foi possível trocar a senha: '+error.message; aviso.style.color='var(--bad)'; return; }

      if(importInput.files && importInput.files[0]){
        await importarArquivo(importInput.files[0]);
        importInput.value = '';
      }
    });
  }

  const btnNew = app.querySelector('[data-new]');
  if(btnNew) btnNew.addEventListener('click', async ()=>{
    const p = novoProjeto('Novo projeto');
    state.projetos.push(p);
    await salvarProjeto(p);
    await salvarLista(state.projetos.map(x=>x.id));
    state.atual = p; state.view='editor'; render();
  });

  const back = app.querySelector('[data-back]');
  if(back) back.addEventListener('click', ()=>{ state.view='lista'; state.atual=null; render(); });

  const openFluxo = app.querySelector('[data-open-fluxo]');
  if(openFluxo) openFluxo.addEventListener('click', ()=>{ state.view='fluxo'; render(); });

  if(titleInput) titleInput.addEventListener('change', async ()=>{
    state.atual.nome = titleInput.value || 'Sem título';
    await salvarProjeto(state.atual);
  });

  app.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener('input', async ()=>{
      const fieldPath = el.getAttribute('data-f');
      const path = fieldPath.split('.');
      let obj = state.atual;
      for(let i=0;i<path.length-1;i++) obj = obj[path[i]];
      const key = path[path.length-1];
      const isDate = el.type==='date';
      const isMoney = el.classList.contains('money-in');
      const isText = !isDate && !isMoney && (el.tagName==='TEXTAREA' || el.type==='text');
      obj[key] = isDate ? el.value : isMoney ? parseMoneyBR(el.value) : isText ? el.value : (el.value===''? 0 : Number(el.value));

      if(path[0]==='terreno' && ['sinal','permuta','outrosCustos','qtdParcelas','valorParcela','valorCompra'].includes(key)){

        atualizarRetornoFinanceiro();
      } else if(fieldPath==='observacoes'){

      } else {

          if(p.vendas.previsao && p.vendas.previsao.length>0) mostrarAviso('Início das vendas alterado — a previsão de vendas foi realocada automaticamente para os novos meses.', 'info');

  app.querySelectorAll('[data-select]').forEach(el=>{

      const path = el.getAttribute('data-select').split('.');

      for(let i=0;i<path.length-1;i++) obj = obj[path[i]];

  if(expandirTudo) expandirTudo.addEventListener('click', ()=>{

      h2.closest('.panel').classList.remove('collapsed');

  });

  if(toggleTabela) toggleTabela.addEventListener('click', ()=>{
    tabelaFluxoAberta = !tabelaFluxoAberta;
    const wrap = app.querySelector('.fluxo-table-wrap');
    if(wrap) wrap.style.display = tabelaFluxoAberta ? 'block' : 'none';
    toggleTabela.textContent = tabelaFluxoAberta ? 'Ocultar lançamentos mês a mês' : 'Ver lançamentos mês a mês';
  });

  app.querySelectorAll('[data-fc]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const path = el.getAttribute('data-fc').split('.');
      let obj = state.atual;
      for(let i=0;i<path.length-1;i++) obj = obj[path[i]];
      obj[path[path.length-1]] = el.checked;
      await salvarProjeto(state.atual);
      renderSidebarAndChart();
    });
  });

  app.querySelectorAll('[data-fc-full]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const path = el.getAttribute('data-fc-full').split('.');
      let obj = state.atual;
      for(let i=0;i<path.length-1;i++) obj = obj[path[i]];
      obj[path[path.length-1]] = el.checked;
      await salvarProjeto(state.atual);
      renderFull();
    });
  });

  app.querySelectorAll('[data-costfield]').forEach(el=>{
    el.addEventListener('input', async ()=>{
      const idx = Number(el.getAttribute('data-idx'));
      const field = el.getAttribute('data-costfield');
      state.atual.custos[idx][field] = field==='valor' ? parseMoneyBR(el.value) : el.value;
      await salvarProjeto(state.atual);
      if(field==='valor') renderSidebarAndChart(); else renderFull();
    });
    if(el.classList.contains('money-in')){
      el.addEventListener('blur', ()=>{ el.value = fmtMoneyInput(parseMoneyBR(el.value)); });
      el.addEventListener('focus', ()=>{ el.select(); });
    }
  });

  app.querySelectorAll('[data-rmrow]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const idx = Number(el.getAttribute('data-rmrow'));
      state.atual.custos.splice(idx,1);
      await salvarProjeto(state.atual);
      renderFull();
    });
  });

  const addRow = app.querySelector('[data-addrow]');
  if(addRow) addRow.addEventListener('click', async ()=>{
    state.atual.custos.push({item:'Novo item', valor:0});
    await salvarProjeto(state.atual);
    renderFull();
  });

  const dup = app.querySelector('[data-dup]');
  if(dup) dup.addEventListener('click', async ()=>{
    const clone = JSON.parse(JSON.stringify(state.atual));
    clone.id = 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    clone.nome = state.atual.nome + ' (cópia)';
    state.projetos.push(clone);
    await salvarProjeto(clone);
    await salvarLista(state.projetos.map(x=>x.id));
    state.atual = clone; render();
  });

  const delCur = app.querySelector('[data-del-current]');
  if(delCur) delCur.addEventListener('click', async ()=>{
    if(!(await confirmarAcao('Excluir este projeto? Essa ação não pode ser desfeita.'))) return;
    await apagarProjeto(state.atual.id);
    state.projetos = state.projetos.filter(x=>x.id!==state.atual.id);
    projetosComparar.delete(state.atual.id);
    state.view='lista'; state.atual=null; render();
    mostrarAviso('Projeto excluído.', 'sucesso');
  });
}

function renderFull(){ render(); }

/* re-render leve: apenas resultado + gráfico, preservando foco do campo em edição */

  if(vplEl){ vplEl.textContent = fmtBRL(r.vpl); vplEl.className = `val ${r.vpl>=0?'pos':'neg'}`; }

  if(ilEl){ ilEl.textContent = r.indiceLucratividade!==null?r.indiceLucratividade.toFixed(2):'—'; ilEl.className = `val ${r.indiceLucratividade!==null&&r.indiceLucratividade>=1?'pos':'neg'}`; }
  const tirMEl = document.querySelector('[data-tir-mensal-valor]');
  if(tirMEl){ tirMEl.textContent = r.tirMensal!==null?fmtPct(r.tirMensal):'Não encontrada'; tirMEl.className = `val ${r.tirMensal!==null&&r.tirMensal>=0?'pos':'neg'}`; }
  const tirAEl = document.querySelector('[data-tir-anual-valor]');
  if(tirAEl){ tirAEl.textContent = r.tirAnual!==null?fmtPct(r.tirAnual):'Não encontrada'; tirAEl.className = `val ${r.tirAnual!==null&&r.tirAnual>=0?'pos':'neg'}`; }
}

function renderSidebarAndChart(){
  const active = document.activeElement;
  const activeSel = active && active.getAttribute ? active.getAttribute('data-f') : null;
  const app = document.getElementById('app');
  const wrap = app.querySelector('.layout');
  if(!wrap){ render(); return; }
  const p = state.atual;
  const r = calcular(p);
  const pos = r.resultado>=0;

  const sidebar = wrap.querySelector('div[style*="sticky"] section.panel');
  if(sidebar){
    sidebar.innerHTML = sidebarHTML(p, r, pos);
  }
  const chartWrap = wrap.querySelector('.chart-wrap');
  if(chartWrap) chartWrap.innerHTML = renderChart(r.fluxo.serie);
  const tabelaWrap = wrap.querySelector('.fluxo-table-wrap');
  if(tabelaWrap) tabelaWrap.innerHTML = renderTabelaFluxo(r.fluxo.serie);

  const obraTable = wrap.querySelector('table.costs');
  if(obraTable){
    const cell = obraTable.querySelector('tr.total td[style]');
    if(cell) cell.textContent = fmtBRL(r.custoObraTotal);
  }
  const hintLotes = wrap.querySelector('.hint-lotes');
  if(hintLotes) hintLotes.innerHTML = `Lotes próprios restantes para venda: <strong>${r.lotesPropios}</strong>`;
  const hintComissao = wrap.querySelector('.hint-comissao');
  if(hintComissao) hintComissao.innerHTML = `Comissão por lote: <strong>${fmtBRL(r.comissaoPorLote)}</strong> · total sobre ${r.qtdDireta} lotes: <strong>${fmtBRL(r.comissaoValor)}</strong>
    ${r.comissaoAbatida ? `<span class="badge bad" style="margin-left:6px;">Abatida do resultado</span>` : `<span class="badge warn" style="margin-left:6px;">Apenas informativa</span>`}`;
  const calcInputs = wrap.querySelectorAll('input.calc[readonly]');
  calcInputs.forEach(el=>{
    const label = el.closest('.field') ? el.closest('.field').querySelector('label').textContent : '';
    if(label.includes('Qtd. lotes vendidos')) el.value = r.qtdDireta;
    if(label.includes('Preço por lote')) el.value = fmtMoneyInput(r.precoDireta);
  });
  const hintReceita = wrap.querySelector('.metric-inline');
  if(hintReceita) hintReceita.innerHTML = `Receita total do projeto <strong class="${r.receitaDireta>=0?'pos':'neg'}">${fmtBRL(r.receitaDireta)}</strong>`;
  const hintEntrada = wrap.querySelector('.hint-entrada');
  if(hintEntrada) hintEntrada.innerHTML = hintEntradaHTML(p, r);
  const hintInvest = wrap.querySelector('.hint-investidores');
  if(hintInvest) hintInvest.innerHTML = `Valor movimentado com investidores: <strong>${fmtBRL(r.receitaInvestidores)}</strong> ${r.investidoresNoResultado ? `<span class="badge good" style="margin-left:6px;">Somando à receita do projeto</span>` : `<span class="badge warn" style="margin-left:6px;">Não soma à receita do projeto</span>`} ${p.vendas.investidores.considerarNoFluxo ? `<span class="badge good" style="margin-left:6px;">No fluxo de caixa</span>` : `<span class="badge warn" style="margin-left:6px;">Fora do fluxo de caixa</span>`}`;
  if(activeSel){
    const el = wrap.querySelector(`[data-f="${activeSel}"]`);
    if(el) el.focus();
  }
}

function usuarioParaEmail(usuario){
  return usuario.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'') + '@estudo.local';
}

/* Shim: substitui o antigo window.storage (Claude) por chamadas reais ao Supabase,
   mantendo exatamente a mesma assinatura usada em todo o resto do sistema. */
window.storage = {
  async get(key){
    const { data, error } = await supabaseClient.from('kv_store').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    if(!data) return null;
    return { key, value: JSON.stringify(data.value), shared:true };
  },
  async set(key, value){
    const parsed = typeof value==='string' ? JSON.parse(value) : value;
    const { error } = await supabaseClient.from('kv_store').upsert({ key, value: parsed, updated_at: new Date().toISOString() });
    if(error) throw error;
    return { key, value, shared:true };
  },
  async delete(key){
    const { error } = await supabaseClient.from('kv_store').delete().eq('key', key);
    if(error) throw error;
    return { key, deleted:true, shared:true };
  },
  async list(prefix){
    let query = supabaseClient.from('kv_store').select('key');
    if(prefix) query = query.like('key', prefix+'%');
    const { data, error } = await query;
    if(error) throw error;
    return { keys:(data||[]).map(r=>r.key), prefix, shared:true };
  }
};

function mostrarApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  init();
}
function mostrarLogin(msgErro){
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  const erroEl = document.getElementById('loginErro');
  if(msgErro){ erroEl.textContent = msgErro; erroEl.style.display = 'block'; }
  else { erroEl.style.display = 'none'; }
}
async function tentarLogin(){
  const usuario = document.getElementById('loginUsuario').value;
  const senha = document.getElementById('loginSenha').value;
  if(!usuario.trim() || !senha){ mostrarLogin('Preencha usuário e senha.'); return; }
  const botao = document.getElementById('loginBotao');
  botao.disabled = true; botao.textContent = 'Entrando...';
  const { error } = await supabaseClient.auth.signInWithPassword({ email: usuarioParaEmail(usuario), password: senha });
  botao.disabled = false; botao.textContent = 'Entrar';
  if(error){ mostrarLogin('Usuário ou senha incorretos.'); return; }
  mostrarApp();
}
document.getElementById('loginBotao').addEventListener('click', tentarLogin);
document.getElementById('loginSenha').addEventListener('keydown', e=>{ if(e.key==='Enter') tentarLogin(); });
document.getElementById('loginUsuario').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginSenha').focus(); });

async function verificarSessao(){
  const { data } = await supabaseClient.auth.getSession();
  if(data && data.session) mostrarApp();
  else mostrarLogin();
}
verificarSessao();
