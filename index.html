<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudo de Viabilidade</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F1EEE4;
    --paper-2:#E8E4D6;
    --ink:#1E2A30;
    --ink-soft:#4B5A60;
    --line:#C9C2AC;
    --line-soft:#DAD5C4;
    --brick:#B14A28;
    --brick-dark:#8A3A20;
    --steel:#2E5266;
    --steel-light:#DCE7EB;
    --good:#33684A;
    --good-bg:#DEEBE1;
    --bad:#9A3324;
    --bad-bg:#F3DED8;
    --amber:#9C6B12;
    --amber-bg:#F3E5C6;
    --radius:6px;
    --mono:'Courier New', Courier, monospace;
    --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    --disp: Georgia, 'Times New Roman', serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    min-height:100vh;
    padding:0;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}

  /* header */
  .hdr{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;margin-bottom:22px;
    flex-wrap:wrap;gap:12px;
  }
  .hdr h1{
    font-family:var(--disp);
    font-size:26px;font-weight:700;margin:0;letter-spacing:0.2px;
  }
  .hdr .sub{
    font-family:var(--mono);font-size:11px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;
  }
  .hdr-actions{display:flex;gap:8px;align-items:center;}

  button{
    font-family:var(--sans);cursor:pointer;
    border:1.5px solid var(--ink);background:var(--paper);
    color:var(--ink);padding:8px 14px;border-radius:var(--radius);
    font-size:13px;font-weight:600;
  }
  button:hover{background:var(--paper-2);}
  button.icon-btn{
    padding:8px 11px;font-size:15px;line-height:1;min-width:38px;
    display:inline-flex;align-items:center;justify-content:center;
  }
  button.primary{background:var(--brick);border-color:var(--brick-dark);color:#fff;}
  button.primary:hover{background:var(--brick-dark);}
  button.ghost{border-color:var(--line);font-weight:400;color:var(--ink-soft);}
  button.danger{border-color:var(--bad);color:var(--bad);}
  button.danger:hover{background:var(--bad-bg);}
  button.btn-receita{border-color:var(--good);color:var(--good);background:var(--good-bg);}
  button.btn-receita:hover{background:var(--good);color:#fff;}
  button.btn-despesa{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);}
  button.btn-despesa:hover{background:var(--bad);color:#fff;}
  button.btn-estimativa{border-color:var(--steel);color:var(--steel);background:var(--steel-light);font-weight:700;}
  button.btn-estimativa:hover{background:var(--steel);color:#fff;}
  button.small{padding:4px 9px;font-size:11px;}
  button:disabled{opacity:.4;cursor:not-allowed;}

  /* ===== LISTA DE PROJETOS ===== */
  .grid-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .card-proj{
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:16px 18px;cursor:pointer;position:relative;
    transition:border-color .15s;
  }
  .card-proj:hover{border-color:var(--brick);}
  .card-proj h3{margin:0 0 6px;font-family:var(--disp);font-size:17px;}
  .card-proj .meta{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-bottom:10px;}
  .card-proj .res{font-family:var(--mono);font-size:15px;font-weight:700;}
  .card-proj .res.pos{color:var(--good);}
  .card-proj .res.neg{color:var(--bad);}
  .card-proj .del{
    position:absolute;top:10px;right:10px;background:none;border:none;
    color:var(--ink-soft);font-size:16px;padding:2px 6px;font-weight:400;
  }
  .card-proj .del:hover{color:var(--bad);}
  .card-proj .card-export{
    position:absolute;top:10px;right:34px;background:none;border:none;
    color:var(--ink-soft);font-size:13px;padding:2px 6px;font-weight:400;line-height:1;
  }
  .card-proj .card-export:hover{color:var(--steel);}
  .card-compare{
    display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--ink-soft);
    cursor:pointer;user-select:none;
  }
  .card-compare input{width:13px;height:13px;}
  .compare-bar{
    display:flex;justify-content:space-between;align-items:center;background:var(--steel-light);
    border:1px solid var(--steel);border-radius:8px;padding:10px 16px;margin-bottom:16px;font-size:13px;color:var(--ink);
  }
  .compare-alerta{
    background:var(--amber-bg);border:1px solid var(--amber);color:var(--amber);border-radius:8px;
    padding:12px 16px;margin:16px 0;font-size:13px;line-height:1.5;
  }
  .aviso-fundamental{
    background:var(--amber-bg);border:1px solid var(--amber);color:var(--amber);border-radius:8px;
    padding:10px 16px;margin:12px 0 0;font-size:12.5px;line-height:1.5;
  }
  .aviso-fundamental ul{margin:4px 0 0;padding-left:18px;}
  .aviso-fundamental li{margin:2px 0;}
  .compare-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:16px;}
  .compare-terreno-box{background:var(--paper-2);border-color:var(--steel);}
  .compare-terreno-box table.compare-tabela td, .compare-terreno-box table.compare-tabela th{border-right-color:var(--line);}
  table.compare-tabela{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;}
  table.compare-tabela th, table.compare-tabela td{padding:9px 16px;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);}
  table.compare-tabela thead th{
    background:var(--steel);color:#fff;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;text-align:left;position:sticky;top:0;
  }
  table.compare-tabela td.compare-label{
    font-weight:600;background:var(--paper-2);position:sticky;left:0;color:var(--ink-soft);font-size:12.5px;
  }
  table.compare-tabela td{font-family:var(--mono);}
  table.compare-tabela td.compare-melhor{background:var(--good-bg);color:var(--good);font-weight:700;}
  .compare-selo{
    font-family:var(--sans);font-size:9px;text-transform:uppercase;letter-spacing:.3px;
    background:var(--good);color:#fff;padding:1px 6px;border-radius:8px;vertical-align:middle;margin-left:4px;
  }
  .empty-state{
    border:1.5px dashed var(--line);border-radius:8px;padding:50px 20px;text-align:center;
    color:var(--ink-soft);
  }
  .empty-state p{font-size:14px;margin:0 0 14px;}

  /* ===== EDITOR ===== */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .toolbar .back{font-size:12px;color:var(--ink-soft);background:none;border:none;padding:4px 0;font-weight:600;}
  .toolbar .back:hover{color:var(--brick);}
  input.title-input{
    font-family:var(--disp);font-size:22px;font-weight:700;border:none;background:transparent;
    border-bottom:2px solid transparent;padding:2px 0;max-width:420px;width:100%;color:var(--ink);
  }
  input.title-input:focus{outline:none;border-bottom:2px solid var(--brick);}

  .layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
  @media(max-width:940px){.layout{grid-template-columns:1fr;}}

  section.panel{
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:18px 20px 22px;margin-bottom:16px;
  }
  section.panel h2{
    font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--steel);margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line-soft);
  }
  section.panel h2.panel-h{cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center;}
  section.panel h2.panel-h .chevron{font-style:normal;font-size:12px;color:var(--ink-soft);transition:transform .15s;}
  section.panel.collapsed h2.panel-h{margin-bottom:0;border-bottom:none;}
  section.panel.collapsed h2.panel-h .chevron{transform:rotate(-90deg);}
  section.panel.collapsed > *:not(h2){display:none;}
  .field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px;margin-bottom:4px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .field input, .field select{
    font-family:var(--mono);font-size:13.5px;padding:7px 8px;border:1px solid var(--line);
    border-radius:4px;background:var(--paper);color:var(--ink);width:100%;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--steel);background:#fff;}
  .field.wide{grid-column:1/-1;}
  .hint{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .metric-inline{
    font-size:13px;color:var(--ink-soft);margin-top:10px;padding:10px 12px;
    background:var(--paper-2);border-radius:6px;display:flex;justify-content:space-between;align-items:center;
  }
  .metric-inline strong{font-family:var(--mono);font-size:17px;}

  table.costs{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  table.costs th{
    text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.5px;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:6px 6px;
  }
  table.costs td{border-bottom:1px solid var(--line-soft);padding:5px 6px;vertical-align:middle;}
  table.costs input{
    font-family:var(--mono);font-size:12.5px;border:1px solid transparent;background:transparent;
    padding:5px 4px;border-radius:3px;width:100%;
  }
  table.costs input:hover{border-color:var(--line);}
  table.costs input:focus{outline:none;border-color:var(--steel);background:var(--steel-light);}
  table.costs td.val input{text-align:right;}
  table.costs tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;padding-top:8px;}
  table.costs td.rm{text-align:center;width:24px;}
  table.costs td.rm button{padding:2px 6px;font-size:11px;border-color:var(--line);color:var(--ink-soft);}

  /* resultados sidebar */
  .metric{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:9px 0;border-bottom:1px solid var(--line-soft);
  }
  .metric:last-child{border-bottom:none;}
  .metric .lbl{font-size:12px;color:var(--ink-soft);}
  .metric .val{font-family:var(--mono);font-size:14px;font-weight:700;}
  .val-sub{font-size:11px;font-weight:400;color:var(--ink-soft);}
  .info-btn{
    display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
    border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
    font-size:10px;font-style:italic;font-family:Georgia,serif;padding:0;margin-left:5px;
    vertical-align:middle;cursor:pointer;line-height:1;
  }
  .info-btn:hover{border-color:var(--steel);color:var(--steel);background:var(--steel-light);}
  .info-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
  .info-formula{font-size:13px;color:var(--ink);background:var(--paper-2);border-radius:6px;padding:8px 10px;margin-top:4px;}
  .info-memoria{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--steel-light);border-radius:6px;padding:8px 10px;margin-top:4px;line-height:1.6;}
  .metric.hero{padding:14px 0;border-bottom:2px solid var(--ink);margin-bottom:6px;}
  .sidebar-group-label{
    font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;
    color:var(--steel);margin:14px 0 2px;
  }
  .metric.hero .lbl{font-size:12.5px;font-weight:600;color:var(--ink);}
  .metric.hero .val{font-size:22px;}
  .pos{color:var(--good);} .neg{color:var(--bad);} .warn{color:var(--amber);}
  .login-screen{
    position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:500;
  }
  .login-box{
    background:var(--paper);border-radius:10px;padding:32px 30px;width:100%;max-width:340px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .login-erro{
    background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-top:8px;
  }
  .rel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 20px;}
  .comp-lista{display:flex;flex-direction:column;gap:2px;}
  .comp-lista-item{
    display:flex;justify-content:space-between;align-items:center;width:100%;
    background:var(--paper);border:1px solid var(--line-soft);border-radius:6px;
    padding:10px 12px;font-size:13px;font-weight:400;text-align:left;cursor:pointer;
  }
  .comp-lista-item:hover{background:var(--paper-2);border-color:var(--steel);}
  .comp-lista-nome{color:var(--ink);}
  .comp-lista-valor{font-family:var(--mono);font-weight:700;white-space:nowrap;}
  table.comp-tabela-edit{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  table.comp-tabela-edit th{text-align:left;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:4px 5px;}
  table.comp-tabela-edit td{padding:3px 5px;vertical-align:middle;}
  table.comp-tabela-edit input{width:100%;font-size:12px;padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;}
  .comp-del-linha{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;padding:2px 4px;}
  .comp-del-linha:hover{color:var(--bad);}
  .rel-item{padding:6px 0;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:10px;font-size:12.5px;}
  .rel-item .l{color:var(--ink-soft);}
  .rel-item .v{font-family:var(--mono);font-weight:700;text-align:right;}

  .obs-textarea{
    width:100%;min-height:160px;resize:vertical;font-family:var(--sans);font-size:13px;line-height:1.5;
    border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper);color:var(--ink);
  }
  .obs-textarea:focus{outline:none;border-color:var(--steel);background:#fff;}

  #obsWidget{position:fixed;right:20px;bottom:20px;z-index:120;}
  .obs-fab{
    display:flex;align-items:center;gap:7px;padding:11px 18px;border-radius:26px;
    background:var(--ink);color:#fff;border:none;font-weight:600;font-size:13px;font-family:var(--sans);
    box-shadow:0 4px 16px rgba(0,0,0,0.28);cursor:pointer;
  }
  .obs-fab:hover{background:var(--brick-dark);}
  .obs-fab-icon{font-style:normal;font-size:14px;}
  .obs-badge{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;}
  .obs-panel{
    position:absolute;right:0;bottom:56px;width:340px;max-width:calc(100vw - 40px);
    max-height:70vh;display:flex;flex-direction:column;
    background:var(--paper);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 34px rgba(0,0,0,0.24);padding:14px;
  }
  .obs-panel-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
    font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;
  }
  .obs-panel-header button{background:none;border:none;font-size:15px;color:var(--ink-soft);cursor:pointer;padding:0 4px;line-height:1;}
  .obs-panel-header button:hover{color:var(--bad);}
  .obs-panel .obs-textarea{min-height:64px;}
  #obsFiltroWrap select{width:100%;padding:6px 8px;font-size:12px;border:1px solid var(--line);border-radius:5px;background:#fff;font-family:var(--sans);}
  .obs-lista{overflow-y:auto;max-height:220px;margin-bottom:10px;border-bottom:1px solid var(--line-soft);padding-bottom:8px;}
  .obs-nota{background:var(--paper-2);border-radius:6px;padding:8px 10px;margin-bottom:6px;}
  .obs-nota-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .obs-nota-tag{
    font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--steel);background:var(--steel-light);padding:2px 7px;border-radius:10px;
  }
  .obs-nota-del{background:none;border:none;color:var(--ink-soft);font-size:11px;cursor:pointer;padding:0 2px;}
  .obs-nota-del:hover{color:var(--bad);}
  .obs-nota-texto{font-size:12.5px;line-height:1.5;color:var(--ink);white-space:pre-wrap;}
  .obs-novo{padding-top:2px;}
  .obs-novo select{width:100%;padding:7px 8px;font-size:12px;border:1px solid var(--line);border-radius:5px;background:#fff;font-family:var(--sans);margin-bottom:6px;}

  .badge{
    display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:20px;letter-spacing:.3px;
  }
  .badge.good{background:var(--good-bg);color:var(--good);}
  .badge.bad{background:var(--bad-bg);color:var(--bad);}
  .badge.warn{background:var(--amber-bg);color:var(--amber);}

  /* chart */
  .chart-wrap{margin-top:6px;}
  .chart-legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;flex-wrap:wrap;}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;}
  .chart-legend i{width:10px;height:10px;display:inline-block;border-radius:2px;}
  svg text{font-family:var(--mono);}
  .add-row-btn{margin-top:10px;}

  .footnote{font-size:10.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}

  .modo-toggle{display:flex;gap:8px;flex-wrap:wrap;}
  .modo-btn{
    font-size:11.5px;padding:6px 10px;border-radius:20px;font-weight:600;
    border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
  }
  .modo-btn.active{background:var(--steel);border-color:var(--steel);color:#fff;}
  .field input.calc{background:var(--steel-light);color:var(--steel);font-weight:700;cursor:not-allowed;}
  input.money-in{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;}
  .field input.money-in{text-align:right;}
  input.money-in.calc{background:var(--steel-light);color:var(--steel);font-weight:700;cursor:not-allowed;}

  .subhead{
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;
    color:var(--brick-dark);margin:20px 0 8px;padding-top:14px;border-top:1px dashed var(--line);
  }
  .check-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);margin:6px 0 4px;}
  .check-row input{width:15px;height:15px;}

  .fluxo-table-scroll{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;}
  table.fluxo-table{margin-top:0;font-size:12px;}
  table.fluxo-table thead th{position:sticky;top:0;background:#fff;z-index:1;}
  table.fluxo-table td.num, table.fluxo-table th.num{text-align:right;}
  table.fluxo-table td.pos{color:var(--good);}
  table.fluxo-table td.neg{color:var(--bad);}
  table.fluxo-table tr.fluxo-mes-row{cursor:pointer;}
  table.fluxo-table tr.fluxo-mes-row:hover{background:var(--steel-light);}
  table.fluxo-table tr.fluxo-mes-row.aberta{background:var(--steel-light);}
  table.fluxo-table tr.fluxo-mes-row .seta{font-style:normal;color:var(--ink-soft);font-size:10px;margin-left:4px;display:inline-block;transition:transform .15s;}
  table.fluxo-table tr.fluxo-mes-row.aberta .seta{transform:rotate(90deg);}
  .fluxo-detalhe{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:10px 4px;}
  .fluxo-detalhe-col{min-width:0;}
  .fluxo-detalhe-titulo{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin-bottom:6px;}
  .fluxo-detalhe-item{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--line-soft);}
  .fluxo-detalhe-item span:first-child{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fluxo-detalhe-vazio{font-size:11.5px;color:var(--ink-soft);font-style:italic;}
  @media(max-width:560px){.fluxo-detalhe{grid-template-columns:1fr;}}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(30,42,48,0.55);z-index:100;

async function carregarComposicoesReferencia(){
  try{
    const r = await window.storage.get(COMPOSICOES_REFERENCIA_KEY);
    if(r && r.value){

      if(dados.custos) BANCO_CUSTOS_REFERENCIA = dados.custos;
      if(dados.pavimentacao) OPCOES_PAVIMENTACAO = dados.pavimentacao;
      if(typeof dados.cubCe==='number') CUB_CE = dados.cubCe;
      return;
    }
  }catch(e){ /* primeira vez rodando, ou chave ainda não existe — segue pra semear abaixo */ }
  await salvarComposicoesReferencia();

/* ---- Retorno financeiro: VPL (valor presente líquido) e TIR (taxa interna de retorno) ---- */
function calcularVPL(serie, taxaMensal){
  let vpl = 0;
  serie.forEach((s,t)=>{ vpl += s.liquido / Math.pow(1+taxaMensal, t); });
  return vpl;
}
function calcularIndiceLucratividade(serie, taxaMensal){
  let vpEntradas = 0, vpSaidas = 0;
  serie.forEach((s,t)=>{
    const fator = Math.pow(1+taxaMensal, t);
    vpEntradas += s.entrada / fator;
    vpSaidas += s.saida / fator;
  });
  return vpSaidas>0 ? vpEntradas/vpSaidas : null;
}
function calcularTIR(serie){
  if(!serie.length) return null;
  const vplAt = taxa => calcularVPL(serie, taxa);
  const taxaMin = -0.99, taxaMax = 20, passos = 400;
  let anterior = vplAt(taxaMin), taxaAnterior = taxaMin, bracket = null;
  for(let i=1;i<=passos;i++){
    const taxa = taxaMin + (taxaMax-taxaMin)*i/passos;
    const v = vplAt(taxa);
    if((anterior<0 && v>=0) || (anterior>0 && v<=0)){ bracket = [taxaAnterior, taxa]; break; }
    anterior = v; taxaAnterior = taxa;
  }
  if(!bracket) return null;
  let [lo, hi] = bracket;
  const vLoSign = vplAt(lo) < 0;
  for(let i=0;i<80;i++){
    const mid = (lo+hi)/2;
    const vMidNeg = vplAt(mid) < 0;
    if(vMidNeg===vLoSign) lo = mid; else hi = mid;
  }
  return (lo+hi)/2;
}

function calcular(p){
  const lotesPropios = Math.max(p.lotes.totalLotes - p.lotes.lotesPermuta, 0);
  const qtdDireta = Math.max(p.lotes.totalLotes - p.lotes.lotesPermuta - (Number(p.vendas.investidores.qtd)||0), 0);
  const comissaoPorLote = (Number(p.comissao.valorLote)||0) * (Number(p.comissao.pct)||0)/100;
  const comissaoAbatida = !!p.comissao.abaterReceita;
  const precoDireta = Math.max((Number(p.comissao.valorLote)||0) - (comissaoAbatida ? comissaoPorLote : 0), 0);
  const receitaDireta = qtdDireta * precoDireta;
  const receitaInvestidores = p.vendas.investidores.qtd * p.vendas.investidores.valorLote;
  const investidoresNoResultado = !!p.vendas.investidores.considerarNoResultado;
  const receitaTotal = receitaDireta + (investidoresNoResultado ? receitaInvestidores : 0);

  const custoObraTotal = p.custos.reduce((s,c)=>s + (Number(c.valor)||0), 0);
  const custoTerrenoCash = (Number(p.terreno.sinal)||0) + (Number(p.terreno.qtdParcelas)||0)*(Number(p.terreno.valorParcela)||0) + (Number(p.terreno.outrosCustos)||0);
  const permutaConsiderada = p.terreno.considerarPermuta!==false;
  const custoTerrenoTotal = custoTerrenoCash + (permutaConsiderada ? (Number(p.terreno.permuta)||0) : 0);

  const custoTotal = custoTerrenoTotal + custoObraTotal;
  const pctImposto = Number(p.fiscal.pctImposto)||0;
  const impostosDireta = receitaDireta * pctImposto/100;
  const impostosInvestidores = investidoresNoResultado ? receitaInvestidores * pctImposto/100 : 0;
  const impostos = impostosDireta + impostosInvestidores;
  const comissaoValor = comissaoPorLote * qtdDireta;
  const resultado = receitaTotal - impostos - (comissaoAbatida?comissaoValor:0) - custoTotal;
  const margem = receitaTotal>0 ? resultado/receitaTotal : 0;
  const investimentoCash = custoTerrenoCash + custoObraTotal;
  const roi = investimentoCash>0 ? resultado/investimentoCash : 0;
  const custoLiquidoPorLote = lotesPropios>0 ? (custoTotal+impostos+(comissaoAbatida?comissaoValor:0))/lotesPropios : 0;

  // fluxo de caixa mensal simplificado — só a venda direta tem cronograma de pagamento definido;
  // a receita de investidores, mesmo quando considerada no resultado, não tem data de recebimento
  // conhecida, então não entra no fluxo de caixa, VPL ou TIR.
  // A comissão NÃO é mais abatida aqui — ela é tratada dentro de calcularFluxo, respeitando a forma
  // de pagamento escolhida (proporcional às prestações, à vista, ou parcelada).
  const receitaLiquidaSemComissao = receitaDireta - impostosDireta;
  const fluxo = calcularFluxo(p, receitaLiquidaSemComissao, qtdDireta, comissaoAbatida?comissaoValor:0);
  const receitaLiquida = receitaLiquidaSemComissao - (comissaoAbatida?comissaoValor:0);
  const terrenoForaDoFluxo = p.terreno.considerarCompraFluxo===false;
  const picoAbs = Math.abs(fluxo.picoInvestimento) + (terrenoForaDoFluxo ? custoTerrenoCash : 0);
  const roiPico = picoAbs>0 ? resultado/picoAbs : 0;
  const multiploCaixa = 1 + roi;
  const multiploPico = 1 + roiPico;

  // retorno financeiro (VPL/TIR), considerando o dinheiro ao longo do tempo
  const taxaDescontoMensal = (Number(p.financeiro && p.financeiro.taxaDescontoMensal)||0)/100;
  const vpl = calcularVPL(fluxo.serie, taxaDescontoMensal);
  const indiceLucratividade = calcularIndiceLucratividade(fluxo.serie, taxaDescontoMensal);
  const tirMensal = calcularTIR(fluxo.serie);
  const tirAnual = tirMensal!==null ? Math.pow(1+tirMensal,12)-1 : null;

  // prazo total do projeto: da compra do terreno até o fim do fluxo de caixa
  const dataCompraRef = new Date(p.terreno.dataCompra+'T00:00:00');
  const dataFinalProjeto = fluxo.dataFinal;
  const duracaoProjetoMeses = dataFinalProjeto ? monthsDiff(dataCompraRef, dataFinalProjeto) : 0;

  return { lotesPropios, qtdDireta, precoDireta, comissaoPorLote, receitaDireta, receitaTotal, receitaInvestidores, investidoresNoResultado, permutaConsiderada,
    custoObraTotal, custoTerrenoCash, custoTerrenoTotal, custoTotal, impostos, comissaoValor, comissaoAbatida,
    resultado, margem, roi, roiPico, multiploCaixa, multiploPico, capitalPico: picoAbs, terrenoForaDoFluxo, custoLiquidoPorLote, investimentoCash, receitaLiquida,
    taxaDescontoMensal, vpl, indiceLucratividade, tirMensal, tirAnual, dataFinalProjeto, duracaoProjetoMeses,
    precoDiretaLiquido: qtdDireta>0 ? receitaLiquida/qtdDireta : 0, fluxo };
}

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function gerarParcelasComReajuste(saldoInicial, qtdParcelas, reajusteAnualPct){
  const reajuste = (Number(reajusteAnualPct)||0)/100;
  const parcelas = [];
  let saldoRestante = saldoInicial;
  let parcelasRestantes = qtdParcelas;
  let parcelaAtual = parcelasRestantes>0 ? saldoRestante/parcelasRestantes : 0;
  for(let mes=0; mes<qtdParcelas; mes++){
    if(mes>0 && mes%12===0 && parcelasRestantes>0){
      saldoRestante *= (1+reajuste);
      parcelaAtual = saldoRestante/parcelasRestantes;
    }
    parcelas.push(parcelaAtual);
    saldoRestante -= parcelaAtual;
    parcelasRestantes -= 1;
  }
  return parcelas;
}

function calcularFluxo(p, receitaLiquidaTotal, qtdDireta, comissaoTotalAbater){
  const dCompra = new Date(p.terreno.dataCompra+'T00:00:00');
  const dObra = new Date(p.obra.inicioObra+'T00:00:00');
  const dVendas = new Date(p.vendas.inicioVendas+'T00:00:00');
  const prazoObra = Math.max(Number(p.obra.prazoObraMeses)||1,1);
  const qtdParcelasTerreno = Math.max(Number(p.terreno.qtdParcelas)||0,0);
  const qtdParcelasVenda = Math.max(Number(p.vendas.condicao.qtdParcelas)||1,1);
  const valorBalao = Number(p.vendas.condicao.valorBalao)||0;
  const intervaloBalao = Math.max(Number(p.vendas.condicao.intervaloBalaoMeses)||0,0);
  const entradaPct = Math.min(Math.max(Number(p.vendas.condicao.entradaPct)||0,0),100);
  const entradaParcelas = Math.max(Number(p.vendas.condicao.entradaParcelas)||1,1);
  const saldoModo = p.vendas.condicao.saldoModo || 'simultaneo';
  const considerarCompraFluxo = p.terreno.considerarCompraFluxo!==false;
  const custos = p.custos || [];
  const investidoresNoFluxo = !!(p.vendas.investidores && p.vendas.investidores.considerarNoFluxo);
  const dRecebimentoInvestidores = (investidoresNoFluxo && p.vendas.investidores.dataRecebimento) ? new Date(p.vendas.investidores.dataRecebimento+'T00:00:00') : null;
  const valorRecebimentoInvestidores = investidoresNoFluxo ? (Number(p.vendas.investidores.qtd)||0) * (Number(p.vendas.investidores.valorLote)||0) : 0;

  const previsao = (p.vendas.previsao && p.vendas.previsao.length) ? p.vendas.previsao : [qtdDireta];
  const somaPrevisao = previsao.reduce((s,n)=>s+(Number(n)||0),0) || 1;
  const formaPagamentoComissao = (p.comissao && p.comissao.formaPagamento) || 'proporcional';
  const qtdParcelasComissao = Math.max(Number(p.comissao && p.comissao.qtdParcelasComissao)||1, 1);
  const abaterComissaoProporcional = formaPagamentoComissao === 'proporcional';
  const netPerLot = (receitaLiquidaTotal - (abaterComissaoProporcional ? (comissaoTotalAbater||0) : 0)) / somaPrevisao;
  const comissaoPorLoteDiluida = (!abaterComissaoProporcional && comissaoTotalAbater>0) ? (comissaoTotalAbater/somaPrevisao) : 0;
  const nBaloes = (valorBalao>0 && intervaloBalao>0) ? Math.floor(qtdParcelasVenda/intervaloBalao) : 0;

  const reajusteSaldoAnual = Number(p.vendas.condicao.reajusteSaldoAnual)||0;
  const cohorts = previsao.map((qtyRaw,i)=>{
    const qty = Number(qtyRaw)||0;
    const dStart = addMonths(dVendas, i);
    const receita = qty * netPerLot;
    const entradaTotal = receita * entradaPct/100;
    const saldoTotal = receita - entradaTotal;
    const cohortBalao = valorBalao * (qty/somaPrevisao);
    const baloesTotal = cohortBalao * nBaloes;
    const entradaMensal = entradaTotal / entradaParcelas;
    const parcelasArray = gerarParcelasComReajuste(Math.max(saldoTotal - baloesTotal, 0), qtdParcelasVenda, reajusteSaldoAnual);
    const dSaldo = saldoModo==='apos_entrada' ? addMonths(dStart, entradaParcelas)
      : saldoModo==='mes_seguinte' ? addMonths(dStart, 1)
      : dStart;
    const comissaoCohort = comissaoPorLoteDiluida * qty;
    return { qty, dStart, dSaldo, entradaMensal, parcelasArray, cohortBalao, comissaoCohort };
  });

  const fimObraPadrao = addMonths(dObra, prazoObra-1);
  let fimObra = fimObraPadrao;
  custos.forEach(c=>{
    if(c.cronograma && c.cronograma.length){
      const fimItem = addMonths(dObra, c.cronograma.length-1);
      if(fimItem > fimObra) fimObra = fimItem;
    }
  });
  const fimParcelasTerreno = qtdParcelasTerreno>0 ? addMonths(dCompra, qtdParcelasTerreno) : dCompra;
  let fimVendasGeral = dVendas;
  cohorts.forEach(c=>{
    if(c.qty<=0) return;
    fimVendasGeral = new Date(Math.max(fimVendasGeral, addMonths(c.dStart, entradaParcelas-1), addMonths(c.dSaldo, qtdParcelasVenda-1)));
  });

  let inicio = considerarCompraFluxo
    ? new Date(Math.min(dCompra, dObra, dVendas))
    : new Date(Math.min(dObra, dVendas));
  if(dRecebimentoInvestidores && dRecebimentoInvestidores < inicio) inicio = dRecebimentoInvestidores;
  let fim = considerarCompraFluxo
    ? new Date(Math.max(fimObra, fimVendasGeral, fimParcelasTerreno))
    : new Date(Math.max(fimObra, fimVendasGeral));
  if(dRecebimentoInvestidores && dRecebimentoInvestidores > fim) fim = dRecebimentoInvestidores;
  let nMeses = monthsDiff(inicio, fim) + 1;
  nMeses = Math.min(Math.max(nMeses,1), 300);

  const meses = [];
  for(let i=0;i<nMeses;i++) meses.push(addMonths(inicio,i));

  const serie = meses.map(m=>{
    let saida = 0, entradaCaixa = 0;
    const detEntradas = [], detSaidas = [];
    const idxObraGlobal = monthsDiff(dObra, m);
    custos.forEach(c=>{
      const valor = Number(c.valor)||0;
      let v = 0;
      if(c.cronograma && c.cronograma.length){
        if(idxObraGlobal>=0 && idxObraGlobal<c.cronograma.length) v = Number(c.cronograma[idxObraGlobal])||0;
      } else {
        if(idxObraGlobal>=0 && idxObraGlobal<prazoObra) v = valor/prazoObra;
      }
      if(v){ saida += v; detSaidas.push({label:c.item, valor:v}); }
    });

    cohorts.forEach(c=>{
      if(c.qty<=0) return;
      const mesVendaLabel = fmtMesAno(c.dStart);
      const idxE = monthsDiff(c.dStart, m);
      if(idxE>=0 && idxE<entradaParcelas && c.entradaMensal){
        entradaCaixa += c.entradaMensal;
        detEntradas.push({label:`Entrada — venda de ${mesVendaLabel}`, valor:c.entradaMensal});
      }
      const idxS = monthsDiff(c.dSaldo, m);
      const parcelaDoMes = (idxS>=0 && idxS<c.parcelasArray.length) ? c.parcelasArray[idxS] : 0;
      if(parcelaDoMes){
        entradaCaixa += parcelaDoMes;
        detEntradas.push({label:`Parcela do saldo — venda de ${mesVendaLabel}`, valor:parcelaDoMes});
      }
      if(intervaloBalao>0 && idxS>=0 && idxS<qtdParcelasVenda && (idxS+1)%intervaloBalao===0 && c.cohortBalao){
        entradaCaixa += c.cohortBalao;
        detEntradas.push({label:`Balão — venda de ${mesVendaLabel}`, valor:c.cohortBalao});
      }
      if(c.comissaoCohort>0 && formaPagamentoComissao!=='proporcional'){
        const idxAncora = entradaPct>0 ? idxE : idxS;
        if(formaPagamentoComissao==='avista'){
          if(idxAncora===0){
            entradaCaixa -= c.comissaoCohort;
            detEntradas.push({label:`Comissão paga à vista — venda de ${mesVendaLabel}`, valor:-c.comissaoCohort});
          }
        } else if(formaPagamentoComissao==='parcelado'){
          if(idxAncora>=0 && idxAncora<qtdParcelasComissao){
            const parcelaComissao = c.comissaoCohort/qtdParcelasComissao;
            entradaCaixa -= parcelaComissao;
            detEntradas.push({label:`Comissão (parcela ${idxAncora+1}/${qtdParcelasComissao}) — venda de ${mesVendaLabel}`, valor:-parcelaComissao});
          }
        }
      }
    });

    if(investidoresNoFluxo && dRecebimentoInvestidores && monthsDiff(dRecebimentoInvestidores, m)===0 && valorRecebimentoInvestidores){
      entradaCaixa += valorRecebimentoInvestidores;
      detEntradas.push({label:'Receita de investidores', valor:valorRecebimentoInvestidores});
    }

    if(considerarCompraFluxo){
      if(monthsDiff(dCompra,m)===0){
        const sinal = Number(p.terreno.sinal)||0;
        const outros = Number(p.terreno.outrosCustos)||0;
        if(sinal){ saida += sinal; detSaidas.push({label:'Sinal da compra do terreno', valor:sinal}); }
        if(outros){ saida += outros; detSaidas.push({label:'Outros custos de aquisição', valor:outros}); }
      }
      const idxParcelaTerreno = monthsDiff(dCompra, m);
      if(qtdParcelasTerreno>0 && idxParcelaTerreno>=1 && idxParcelaTerreno<=qtdParcelasTerreno){
        const vp = Number(p.terreno.valorParcela)||0;
        if(vp){ saida += vp; detSaidas.push({label:`Parcela da compra do terreno (${idxParcelaTerreno}/${qtdParcelasTerreno})`, valor:vp}); }
      }
    }
    return { mes:m, entrada:entradaCaixa, saida, liquido: entradaCaixa-saida, detEntradas, detSaidas };
  });

  let acumulado = 0, pico = 0, picoIdx = 0, payback = null;
  serie.forEach((s,i)=>{
    acumulado += s.liquido;
    s.acumulado = acumulado;
    if(acumulado < pico){ pico = acumulado; picoIdx = i; }
    if(payback===null && acumulado>=0 && i>0) payback = i;
  });

  return {
    serie,
    picoInvestimento: pico,
    picoMes: serie.length ? serie[picoIdx].mes : null,
    paybackMes: payback!==null ? serie[payback].mes : null,
    dataFinal: fim
  };
}
function addMonths(date,n){ const d=new Date(date); d.setMonth(d.getMonth()+n); return d; }
function monthsDiff(a,b){ return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()); }

function round2(v){ return Math.round((Number(v)||0)*100)/100; }
function fmtMoneyInput(v){
  return (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function parseMoneyBR(str){
  if(str===undefined||str===null) return 0;
  let s = String(str).trim();
  if(s==='') return 0;
  const neg = s.startsWith('-');
  s = s.replace(/[^\d,]/g,'');
  if(s==='') return 0;
  const lastComma = s.lastIndexOf(',');
  let result;
  if(lastComma===-1){
    result = parseFloat(s)||0;
  } else {
    const intPart = s.slice(0,lastComma).replace(/,/g,'');
    const decPart = s.slice(lastComma+1);
    result = parseFloat((intPart||'0')+'.'+(decPart||'0'))||0;
  }
  return neg ? -result : result;
}
function fmtBRL(v){
  if(v===null||v===undefined||isNaN(v)) return 'R$ 0,00';
  const neg = v<0;
  const abs = Math.abs(v);
  const casas = abs<1000 ? 2 : 0;
  const s = abs.toLocaleString('pt-BR',{minimumFractionDigits:casas,maximumFractionDigits:casas});
  return (neg?'-':'')+'R$ '+s;
}
function fmtPct(v){ return (v*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%'; }
function fmtMesAno(d){ const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; return meses[d.getMonth()]+'/'+String(d.getFullYear()).slice(2); }
function fmtDuracao(totalMeses){
  totalMeses = Math.max(Math.round(totalMeses),0);
  const anos = Math.floor(totalMeses/12);
  const meses = totalMeses%12;
  if(anos===0) return `${meses} ${meses===1?'mês':'meses'}`;
  if(meses===0) return `${anos} ${anos===1?'ano':'anos'}`;
  return `${anos} ${anos===1?'ano':'anos'} e ${meses} ${meses===1?'mês':'meses'}`;
}

function slugify(s){
  return String(s||'projeto').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'projeto';
}

function confirmarAcao(mensagem){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.zIndex = '200';
    overlay.innerHTML = `
      <div class="modal-box" style="max-width:380px;">
        <p style="margin:0 0 18px;font-size:14px;line-height:1.5;">${escapeHtml(mensagem)}</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="ghost" data-confirmar-nao="1">Cancelar</button>
          <button class="danger" data-confirmar-sim="1">Confirmar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    function encerrar(resultado){ overlay.remove(); resolve(resultado); }
    overlay.querySelector('[data-confirmar-sim]').addEventListener('click', ()=>encerrar(true));
    overlay.querySelector('[data-confirmar-nao]').addEventListener('click', ()=>encerrar(false));
  });
}
function mostrarAviso(mensagem, tipo){
  tipo = tipo || 'info';
  const cores = { info:['var(--steel)','var(--steel-light)'], sucesso:['var(--good)','var(--good-bg)'], erro:['var(--bad)','var(--bad-bg)'] };
  const [cor, fundo] = cores[tipo] || cores.info;
  const aviso = document.createElement('div');
  aviso.style.cssText = `position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:300;
    background:${fundo};color:${cor};border:1px solid ${cor};border-radius:8px;padding:12px 20px;
    font-size:13.5px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,0.15);max-width:90vw;text-align:center;`;
  aviso.textContent = mensagem;
  document.body.appendChild(aviso);
  setTimeout(()=>{ aviso.style.transition='opacity .3s'; aviso.style.opacity='0'; setTimeout(()=>aviso.remove(), 300); }, 3200);
}

function baixarJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function baixarHTML(htmlContent, filename){
  const blob = new Blob([htmlContent], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function projetoValido(obj){
  return obj && typeof obj==='object' && obj.terreno && obj.custos && Array.isArray(obj.custos) && obj.vendas;
}
async function importarArquivo(file){
  let data;
  try{
    const texto = await file.text();
    data = JSON.parse(texto);
  }catch(e){
    mostrarAviso('Não foi possível ler o arquivo. Verifique se é um JSON válido exportado por este sistema.', 'erro');
    return;
  }
  let candidatos;
  if(Array.isArray(data)) candidatos = data;
  else if(data && Array.isArray(data.projetos)) candidatos = data.projetos;
  else if(projetoValido(data)) candidatos = [data];
  else { mostrarAviso('Arquivo não reconhecido. Selecione um JSON exportado por este sistema (um projeto ou um backup).', 'erro'); return; }

  let importados = 0;
  for(const raw of candidatos){
    if(!projetoValido(raw)) continue;
    const novo = JSON.parse(JSON.stringify(raw));
    novo.id = 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    normalizarProjeto(novo);
    state.projetos.push(novo);
    await salvarProjeto(novo);
    importados++;
  }
  if(importados===0){ mostrarAviso('Nenhum projeto válido encontrado no arquivo.', 'erro'); return; }
  await salvarLista(state.projetos.map(x=>x.id));
  render();
  mostrarAviso(importados===1 ? '1 projeto importado com sucesso.' : importados+' projetos importados com sucesso.', 'sucesso');
}

let state = { view:'lista', projetos:[], atual:null, loading:true };
let projetosComparar = new Set();

async function init(){
  await carregarComposicoesReferencia();
  const ids = await carregarLista();
  const projs = [];
  for(const id of ids){ const p = await carregarProjeto(id); if(p) projs.push(p); }
  if(projs.length===0){
    const modelo = projetoModelo();
    await salvarProjeto(modelo);
    await salvarLista([modelo.id]);
    projs.push(modelo);
  }
  state.projetos = projs;
  state.loading = false;
  render();
}

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = '<div class="wrap"><p style="padding:40px;text-align:center;color:var(--ink-soft)">Carregando…</p></div>'; return; }
  app.innerHTML = state.view==='lista' ? renderLista()
    : state.view==='fluxo' ? renderFluxoView(state.atual)
    : state.view==='comparar' ? renderComparar()
    : renderEditor(state.atual);
  bindEvents();
  garantirWidgetObservacoes();
}

      </button>`;
    document.body.appendChild(widget);

    widget.querySelector('#obsBotao').addEventListener('click', ()=>{
      const abrir = painel.style.display==='none';
      painel.style.display = abrir ? 'block' : 'none';

      });
      await salvarProjeto(state.atual);
      textoEl.value = '';
      renderObsPainel();
    });

  const projetoId = state.atual ? state.atual.id : null;
  if(widget.dataset.projetoId !== projetoId){
    widget.dataset.projetoId = projetoId;

function renderObsPainel(){
  const widget = document.getElementById('obsWidget');
  if(!widget || !state.atual) return;
  const p = state.atual;
  const notas = p.observacoesNotas || [];
  const topicosExistentes = [...new Set(notas.map(n=>n.topico))];

  const filtroWrap = widget.querySelector('#obsFiltroWrap');
  if(filtroWrap){
    if(topicosExistentes.length===0){
      filtroWrap.innerHTML = '';
    } else {
      filtroWrap.innerHTML = `<select id="obsFiltro" style="margin-bottom:8px;">
        <option value="todos">Todos os tópicos (${notas.length})</option>
        ${topicosExistentes.map(t=>`<option value="${escapeHtml(t)}" ${obsFiltroTopico===t?'selected':''}>${escapeHtml(t)} (${notas.filter(n=>n.topico===t).length})</option>`).join('')}
      </select>`;
      const filtroSel = filtroWrap.querySelector('#obsFiltro');
      filtroSel.value = obsFiltroTopico;
      filtroSel.addEventListener('change', ()=>{ obsFiltroTopico = filtroSel.value; renderObsPainel(); });
    }
  }

  const listaEl = widget.querySelector('#obsLista');
  if(listaEl){
    const filtradas = obsFiltroTopico==='todos' ? notas : notas.filter(n=>n.topico===obsFiltroTopico);
    listaEl.innerHTML = filtradas.length===0
      ? `<div class="footnote" style="padding:6px 0;">${notas.length===0?'Nenhuma observação ainda.':'Nenhuma nota nesse tópico.'}</div>`
      : filtradas.map(n=>`
        <div class="obs-nota">
          <div class="obs-nota-topo">
            <span class="obs-nota-tag">${escapeHtml(n.topico)}</span>
            <button type="button" class="obs-nota-del" data-obs-del="${n.id}" title="Excluir nota">✕</button>
          </div>
          <div class="obs-nota-texto">${escapeHtml(n.texto)}</div>
        </div>`).join('');

    listaEl.querySelectorAll('[data-obs-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.getAttribute('data-obs-del');
        state.atual.observacoesNotas = state.atual.observacoesNotas.filter(n=>n.id!==id);
        await salvarProjeto(state.atual);
        renderObsPainel();
        atualizarBadgeObs();
      });
    });
  }

  const topicoSel = widget.querySelector('#obsNovoTopico');
  if(topicoSel && topicoSel.dataset.projetoId !== p.id){
    topicoSel.dataset.projetoId = p.id;
    topicoSel.innerHTML = listaTopicosObservacao(p).map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  }
}

function melhorIndice(valores, direcao){
  let melhorIdx = -1, melhorVal = null;
  valores.forEach((v,i)=>{
    if(v===null || v===undefined || isNaN(v)) return;
    if(melhorVal===null || (direcao==='maior' ? v>melhorVal : v<melhorVal)){ melhorVal=v; melhorIdx=i; }
  });
  return melhorIdx;
}

function linhaComparar(label, chaveInfo, valores, fmtFn, direcao){
  const idxMelhor = direcao ? melhorIndice(valores, direcao) : -1;
  const celulas = valores.map((v,i)=>{
    const destaque = i===idxMelhor && valores.filter(x=>x!==null&&x!==undefined&&!isNaN(x)).length>1;
    return `<td class="${destaque?'compare-melhor':''}">${fmtFn(v)}${destaque?' <span class="compare-selo">melhor</span>':''}</td>`;
  }).join('');
  return `<tr><td class="compare-label">${chaveInfo?lblInfo(label,chaveInfo):label}</td>${celulas}</tr>`;
}

function renderComparar(){
  const selecionados = [...projetosComparar]
    .map(id=>state.projetos.find(p=>p.id===id))
    .filter(Boolean)
    .map(p=>({ p, r: calcular(p) }));

  if(selecionados.length<2){
    return `<div class="wrap">
      <div class="toolbar"><button class="back" data-back="1">← Todos os projetos</button></div>
      <p class="footnote" style="padding:20px 0;">Selecione pelo menos dois projetos na lista para comparar.</p>
    </div>`;
  }

  const taxas = selecionados.map(x=>Number(x.p.financeiro.taxaDescontoMensal)||0);
  const taxaMin = Math.min(...taxas), taxaMax = Math.max(...taxas);
  const diffTaxa = taxaMax - taxaMin;
  const alertaTaxa = diffTaxa >= 0.5;

  const headerCols = selecionados.map(x=>`<th>${escapeHtml(x.p.nome)}</th>`).join('');

  const padroesFabricaComparar = {
    topografia: 'plano', densidadeVegetal: 'pouco_denso', tamanhoLote: 200, padrao: 'medio', pavimentacao: 'bloquete',
    pctViario: URBANISTICO_PADRAO.pctViario, pctVerdeInstitucional: URBANISTICO_PADRAO.pctVerdeInstitucional, fatorAproveitamento: URBANISTICO_PADRAO.fatorAproveitamento,
  };
  const urbSelecionados = selecionados.map(x=>{
    const params = x.p.autoParams ? { ...padroesFabricaComparar, ...x.p.autoParams } : padroesFabricaComparar;
    return calcularMotorUrbanistico(x.p, params);
  });

  const temPermutaLotes = selecionados.some(x=>Number(x.p.lotes.lotesPermuta)>0);
  const temInvestidorLotes = selecionados.some(x=>Number(x.p.vendas.investidores.qtd)>0);
  const temPermutaValor = selecionados.some(x=>Number(x.p.terreno.permuta)>0);

  const linhasTerreno = [
    linhaComparar('Área do terreno', null, selecionados.map(x=>x.p.terreno.area), v=>`${Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0})} m²`, null),
    linhaComparar('Perímetro do terreno', null, selecionados.map(x=>x.p.terreno.perimetro), v=>`${Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0})} m`, null),
    linhaComparar('Valor de compra do terreno (total)', null, selecionados.map(x=>x.p.terreno.valorCompra), fmtBRL, null),
    ...(temPermutaValor ? [linhaComparar('— em permuta (lotes)', null, selecionados.map(x=>x.p.terreno.permuta||0), fmtBRL, null)] : []),
    ...(temPermutaValor ? [linhaComparar('— efetivo (dinheiro)', null, selecionados.map(x=>(x.p.terreno.valorCompra||0)-(x.p.terreno.permuta||0)), fmtBRL, null)] : []),
    linhaComparar('ALV líquida estimada (vendável)', null, urbSelecionados.map(u=>u.alvLiquida), v=>`${Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0})} m²`, null),
    linhaComparar('Quantidade de lotes (total)', null, selecionados.map(x=>x.p.lotes.totalLotes), v=>Number(v).toLocaleString('pt-BR'), null),
    ...(temPermutaLotes ? [linhaComparar('— lotes de permuta', null, selecionados.map(x=>x.p.lotes.lotesPermuta), v=>Number(v||0).toLocaleString('pt-BR'), null)] : []),
    ...(temInvestidorLotes ? [linhaComparar('— lotes de investidores', null, selecionados.map(x=>x.p.vendas.investidores.qtd), v=>Number(v||0).toLocaleString('pt-BR'), null)] : []),
    ...((temPermutaLotes || temInvestidorLotes) ? [linhaComparar('— lotes próprios (venda direta)', null, selecionados.map(x=>x.r.lotesPropios), v=>Number(v||0).toLocaleString('pt-BR'), null)] : []),
    linhaComparar('Preço de venda por lote', null, selecionados.map(x=>x.p.comissao.valorLote), fmtBRL, null),
    linhaComparar('Custo por lote', 'custoLiquidoPorLote', selecionados.map(x=>x.r.custoLiquidoPorLote), fmtBRL, null),
  ];
  const linhas = [
    linhaComparar('Taxa de desconto usada', null, selecionados.map(x=>x.p.financeiro.taxaDescontoMensal), v=>`${v}% a.m.`, null),
    linhaComparar('Resultado líquido', 'resultado', selecionados.map(x=>x.r.resultado), fmtBRL, 'maior'),
    linhaComparar('Margem líquida', 'margem', selecionados.map(x=>x.r.margem), fmtPct, 'maior'),
    linhaComparar('Receita total', 'receitaTotal', selecionados.map(x=>x.r.receitaTotal), fmtBRL, 'maior'),
    linhaComparar('Custo total', 'custoTotal', selecionados.map(x=>x.r.custoTotal), fmtBRL, 'menor'),
    linhaComparar('Pico de investimento em caixa', 'picoInvestimento', selecionados.map(x=>x.r.fluxo.picoInvestimento), fmtBRL, 'maior'),
    linhaComparar('Retorno sobre caixa investido', 'roi', selecionados.map(x=>x.r.roi), fmtPct, 'maior'),
    linhaComparar('Retorno sobre pico de investimento', 'roiPico', selecionados.map(x=>x.r.roiPico), fmtPct, 'maior'),
    linhaComparar('Índice de Lucratividade', 'indiceLucratividade', selecionados.map(x=>x.r.indiceLucratividade), v=>v!==null?v.toFixed(2):'—', 'maior'),
    linhaComparar('VPL do projeto', 'vpl', selecionados.map(x=>x.r.vpl), fmtBRL, 'maior'),
    linhaComparar('TIR mensal', 'tirMensal', selecionados.map(x=>x.r.tirMensal), v=>v!==null?fmtPct(v):'Não encontrada', 'maior'),
    linhaComparar('TIR anual', 'tirAnual', selecionados.map(x=>x.r.tirAnual), v=>v!==null?fmtPct(v):'Não encontrada', 'maior'),
    linhaComparar('Início do retorno', null, selecionados.map(x=>x.r.fluxo.paybackMes ? new Date(x.r.fluxo.paybackMes).getTime() : null), v=>v!==null?fmtMesAno(new Date(v)):'Não atingido', 'menor'),
    linhaComparar('Duração total do projeto', null, selecionados.map(x=>x.r.duracaoProjetoMeses), fmtDuracao, 'menor'),
  ];

  return `<div class="wrap">
    <div class="toolbar">
      <button class="back" data-back="1">← Todos os projetos</button>
      <button class="ghost" data-relatorio-comparar="1">Relatório do comparativo</button>
    </div>
    <input class="title-input" value="Comparativo de projetos" readonly style="border:none;cursor:default;">

    ${alertaTaxa ? `
      <div class="compare-alerta">
        <strong>Atenção:</strong> os projetos selecionados usam taxas de desconto diferentes (de ${taxaMin}% a ${taxaMax}% ao mês). O VPL não é diretamente comparável entre eles nesse caso — compare pela TIR (que independe da taxa) ou ajuste as taxas de cada projeto pra ficarem iguais antes de comparar o VPL.
      </div>` : ''}

    <div class="subhead" style="margin-top:8px;">Dados do terreno e dos lotes</div>
    <div class="compare-scroll compare-terreno-box">
      <table class="compare-tabela">
        <thead><tr><th></th>${headerCols}</tr></thead>
        <tbody>${linhasTerreno.join('')}</tbody>
      </table>
    </div>
    <div class="footnote" style="margin-top:8px;">Dados descritivos, sem "melhor" — não faz sentido dizer que um terreno maior ou mais caro é melhor sem olhar o resto do projeto.</div>

    <div class="subhead" style="margin-top:24px;">Indicadores financeiros e de retorno</div>
    <div class="compare-scroll">
      <table class="compare-tabela">
        <thead><tr><th></th>${headerCols}</tr></thead>
        <tbody>${linhas.join('')}</tbody>
      </table>
    </div>
    <div class="footnote" style="margin-top:12px;">As células marcadas "melhor" indicam o maior ou menor valor entre os projetos selecionados nesse indicador específico — não é um veredito geral. Um projeto pode vencer em retorno e perder em prazo, por exemplo.</div>

    <div class="subhead" style="margin-top:24px;">Comparativo de orçamento (itens de custo de obra)</div>
    <div class="compare-scroll">
      <table class="compare-tabela">
        <thead><tr><th></th>${headerCols}</tr></thead>
        <tbody>
          ${(()=>{
            const todosItens = [...new Set(selecionados.flatMap(x=>x.p.custos.map(c=>c.item)))];
            const linhasItens = todosItens.map(item=>{
              const valores = selecionados.map(x=>{
                const c = x.p.custos.find(cc=>cc.item===item);
                return c ? Number(c.valor)||0 : null;
              });
              return linhaComparar(item, null, valores, v=>v!==null?fmtBRL(v):'—', 'menor');
            });
            const linhaTotalObra = linhaComparar('Total de custo de obra', null, selecionados.map(x=>x.r.custoObraTotal), fmtBRL, 'menor');
            return linhasItens.join('') + linhaTotalObra;
          })()}
        </tbody>
      </table>
    </div>
    <div class="footnote" style="margin-top:8px;">Itens que existem num projeto e não em outro aparecem como "—". "Melhor" aqui significa menor custo naquele item — não avalia se o item foi bem dimensionado.</div>
  </div>`;
}


function renderFluxoView(p){
  const r = calcular(p);
  const chart = renderChart(r.fluxo.serie);
  const temPrevisao = p.vendas.previsao && p.vendas.previsao.length>0;
  const somaPrevisao = temPrevisao ? p.vendas.previsao.reduce((s,n)=>s+(Number(n)||0),0) : 0;
  const custosComCronograma = p.custos.filter(c=>c.cronograma && c.cronograma.length>0).length;
  return `<div class="wrap">
    <div class="toolbar">
      <button class="back" data-back-editor="1">← Voltar ao projeto</button>
    </div>
    <input class="title-input" value="${escapeHtml(p.nome)} — fluxo de caixa" readonly style="border:none;cursor:default;">
    ${avisosFundamentaisHtml(p)}

    <div class="field-row" style="margin:18px 0;">
      <div class="metric" style="background:var(--paper-2);border-radius:8px;padding:12px 14px;border-bottom:none;"><span class="lbl">Pico de investimento em caixa</span><span class="val neg">${fmtBRL(r.fluxo.picoInvestimento)}${r.fluxo.picoMes?` <span class="val-sub">(${fmtMesAno(new Date(r.fluxo.picoMes))})</span>`:''}</span></div>
      <div class="metric" style="background:var(--paper-2);border-radius:8px;padding:12px 14px;border-bottom:none;"><span class="lbl">Início do retorno</span><span class="val ${r.fluxo.paybackMes?'pos':'neg'}">${r.fluxo.paybackMes?fmtMesAno(new Date(r.fluxo.paybackMes)):'Não atingido'}</span></div>
      <div class="metric" style="background:var(--paper-2);border-radius:8px;padding:12px 14px;border-bottom:none;"><span class="lbl">Data final do projeto</span><span class="val">${r.dataFinalProjeto?fmtMesAno(new Date(r.dataFinalProjeto)):'—'}<span class="val-sub"> (${fmtDuracao(r.duracaoProjetoMeses)})</span></span></div>
      <div class="metric" style="background:var(--paper-2);border-radius:8px;padding:12px 14px;border-bottom:none;"><span class="lbl">Resultado líquido projetado</span><span class="val ${r.resultado>=0?'pos':'neg'}">${fmtBRL(r.resultado)}</span></div>
    </div>

    <section class="panel">
      <h2>Retorno financeiro (VPL e TIR)</h2>
      <div class="field-row" style="align-items:flex-end;">
        <div class="field"><label>Taxa de desconto mensal (%)</label><input type="number" step="0.01" data-f="financeiro.taxaDescontoMensal" value="${p.financeiro.taxaDescontoMensal}"></div>
        <button type="button" class="ghost small" data-atualizar-cdi="1" style="height:38px;" title="Busca o CDI mais recente no Banco Central e converte pra taxa mensal">↻ Atualizar com o CDI</button>
        <span class="footnote" id="cdiStatusMsg" style="align-self:center;"></span>
      </div>
      <div class="field-row" style="margin-top:12px;">
        <div class="metric" style="background:var(--paper-2);border-radius:8px;padding:12px 14px;border-bottom:none;"><span class="lbl">${lblInfo('VPL do projeto','vpl')}</span><span class="val ${r.vpl>=0?'pos':'neg'}" data-vpl-valor>${fmtBRL(r.vpl)}</span></div>
        <div class="metric" style="background:var(--paper-2);border-radius:8px;padding:12px 14px;border-bottom:none;"><span class="lbl">${lblInfo('Índice de Lucratividade','indiceLucratividade')}</span><span class="val ${r.indiceLucratividade!==null&&r.indiceLucratividade>=1?'pos':'neg'}" data-il-valor>${r.indiceLucratividade!==null?r.indiceLucratividade.toFixed(2):'—'}</span></div>
        <div class="metric" style="background:var(--paper-2);border-radius:8px;padding:12px 14px;border-bottom:none;"><span class="lbl">${lblInfo('TIR mensal','tirMensal')}</span><span class="val ${r.tirMensal!==null&&r.tirMensal>=0?'pos':'neg'}" data-tir-mensal-valor>${r.tirMensal!==null?fmtPct(r.tirMensal):'Não encontrada'}</span></div>
        <div class="metric" style="background:var(--paper-2);border-radius:8px;padding:12px 14px;border-bottom:none;"><span class="lbl">${lblInfo('TIR anual','tirAnual')}</span><span class="val ${r.tirAnual!==null&&r.tirAnual>=0?'pos':'neg'}" data-tir-anual-valor>${r.tirAnual!==null?fmtPct(r.tirAnual):'Não encontrada'}</span></div>
      </div>
      <div class="footnote" style="margin-top:10px;">VPL traz cada mês do fluxo de caixa a valor de hoje, usando a taxa acima. TIR é a taxa que faria o VPL ser exatamente zero — compare com a taxa mínima que você exige para saber se o projeto vale a pena.</div>
    </section>

    <section class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:2px;">
        <h2 style="margin:0;border:none;padding:0;">Fluxo de caixa mensal estimado</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-receita" data-abrir-previsao="1">Previsão de vendas</button>
          <button class="btn-despesa" data-abrir-cronograma="1">Cronograma de desembolso</button>
        </div>
      </div>
      <div class="hint" style="margin-bottom:6px;">
        ${temPrevisao
          ? `Previsão mês a mês ativa: <strong>${somaPrevisao}</strong> de <strong>${r.qtdDireta}</strong> lotes distribuídos ao longo de ${p.vendas.previsao.length} meses. ${somaPrevisao!==r.qtdDireta?'<span class="badge warn" style="margin-left:6px;">Soma diferente do total de lotes</span>':'<span class="badge good" style="margin-left:6px;">Soma bate com o total</span>'}`
          : `Sem previsão detalhada: o sistema está considerando todos os ${r.qtdDireta} lotes vendidos de uma vez, no início das vendas.`}
      </div>
      <div class="hint" style="margin-bottom:12px;">
        ${custosComCronograma>0
          ? `Cronograma de desembolso ativo em <strong>${custosComCronograma}</strong> de ${p.custos.length} itens de obra. Os demais continuam com distribuição linear pelo prazo de obra.`
          : `Sem cronograma detalhado: os custos de obra estão sendo distribuídos linearmente pelo prazo de obra.`}
      </div>
      <div class="chart-legend">
        <span><i style="background:var(--steel)"></i>Receita</span>
        <span><i style="background:var(--brick)"></i>Custo</span>
        <span><i style="background:var(--ink)"></i>Saldo acumulado</span>
      </div>
      <div class="chart-wrap">${chart}</div>
      <button class="ghost small" style="margin-top:10px;" data-toggle-tabela="1">${tabelaFluxoAberta?'Ocultar lançamentos mês a mês':'Ver lançamentos mês a mês'}</button>
      <div class="fluxo-table-wrap" style="display:${tabelaFluxoAberta?'block':'none'};margin-top:10px;">${renderTabelaFluxo(r.fluxo.serie)}</div>
      <div class="footnote">Custos de obra distribuídos linearmente pelo prazo de obra; receita líquida distribuída linearmente pelo prazo de vendas. Aproximação para especulação inicial, não substitui um cronograma físico-financeiro detalhado.</div>
    </section>
  </div>`;
}

function renderEditor(p){
  const r = calcular(p);
  const pos = r.resultado>=0;
  const lotesPropios = r.lotesPropios;
  const custosRows = p.custos.map((c,i)=>`
    <tr>
      <td><input data-costfield="item" data-idx="${i}" value="${escapeHtml(c.item)}">${c.origemAuto?' <span class="badge good" style="font-size:9px;padding:1px 6px;" title="Este valor foi lançado automaticamente pelo botão Auto">⚡ Auto</span>':''}</td>
      <td class="val"><input data-costfield="valor" data-idx="${i}" type="text" inputmode="decimal" class="money-in" value="${fmtMoneyInput(c.valor)}"></td>
      <td class="rm"><button data-rmrow="${i}" title="Remover">✕</button></td>
    </tr>`).join('');

  return `<div class="wrap">
    <div class="toolbar">
      <button class="back" data-back="1">← Todos os projetos</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button data-recolher-tudo="1" class="ghost">Recolher tudo</button>
        <button data-expandir-tudo="1" class="ghost">Expandir tudo</button>
        <button data-abrir-estimativa="1" class="btn-estimativa">⚡ Auto</button>
        <button data-abrir-composicoes="1" class="ghost">Tabelas de composição</button>
        <button data-relatorio="${p.id}" class="ghost">Relatório</button>
        <button data-export="${p.id}" class="ghost">Exportar</button>
        <button data-dup="1" class="ghost">Duplicar</button>
        <button data-del-current="1" class="danger">Excluir</button>
      </div>
    </div>
    <input class="title-input" id="titleInput" value="${escapeHtml(p.nome)}">
    ${avisosFundamentaisHtml(p)}

    <div class="layout" style="margin-top:18px;">
      <div>

        <section class="panel ${paineisColapsados['terreno']?'collapsed':''}" id="painel-terreno">
          <h2 class="panel-h" data-panel-id="terreno">Terreno e condições de compra <i class="chevron">▾</i></h2>
          <div class="field-row">
            <div class="field"><label>Área do terreno (m²)</label><input type="number" data-f="terreno.area" value="${p.terreno.area}"></div>
            <div class="field"><label>Perímetro (m)</label><input type="number" data-f="terreno.perimetro" value="${p.terreno.perimetro}"></div>
            <div class="field"><label>Data da compra</label><input type="date" data-f="terreno.dataCompra" value="${p.terreno.dataCompra}"></div>
          </div>
          <div class="footnote" style="margin:2px 0 8px;">O perímetro é calculado automaticamente quando você preenche a área (considerando um terreno aproximadamente quadrado), mas pode ser editado livremente se você souber o valor real.</div>

          <div class="field-row" style="margin-top:10px;">
            <div class="field">
              <label>Como calcular a compra</label>
              <select data-select="terreno.modo">
                <option value="auto_parcela" ${p.terreno.modo==='auto_parcela'?'selected':''}>Eu informo o total, sistema calcula a parcela</option>
                <option value="auto_total" ${p.terreno.modo==='auto_total'?'selected':''}>Eu informo a parcela, sistema soma o total</option>
              </select>
            </div>
          </div>

          <div class="field-row" style="margin-top:10px;">
            <div class="field">
              <label>Valor total da compra (R$)${p.terreno.modo==='auto_total'?' — calculado':''}</label>
              <input type="text" inputmode="decimal" class="money-in ${p.terreno.modo==='auto_total'?'calc':''}" data-f="terreno.valorCompra" value="${fmtMoneyInput(p.terreno.valorCompra)}" ${p.terreno.modo==='auto_total'?'readonly':''}>
            </div>
            <div class="field"><label>Sinal, à vista (R$)</label><input type="text" inputmode="decimal" class="money-in" data-f="terreno.sinal" value="${fmtMoneyInput(p.terreno.sinal)}"></div>
            <div class="field"><label>Qtd. parcelas</label><input type="number" data-f="terreno.qtdParcelas" value="${p.terreno.qtdParcelas}"></div>
            <div class="field">
              <label>Valor de cada parcela (R$)${p.terreno.modo==='auto_parcela'?' — calculado':''}</label>
              <input type="text" inputmode="decimal" class="money-in ${p.terreno.modo==='auto_parcela'?'calc':''}" data-f="terreno.valorParcela" value="${fmtMoneyInput(p.terreno.valorParcela)}" ${p.terreno.modo==='auto_parcela'?'readonly':''}>
            </div>
            <div class="field">
              <label>Como informar a permuta</label>
              <select data-select="terreno.permutaModo">
                <option value="valor" ${p.terreno.permutaModo!=='percentual'?'selected':''}>Valor em R$</option>
                <option value="percentual" ${p.terreno.permutaModo==='percentual'?'selected':''}>% do valor de compra</option>
              </select>
            </div>
            ${p.terreno.permutaModo==='percentual' ? `
            <div class="field"><label>Permuta (% do valor de compra)</label><input type="number" step="0.1" data-f="terreno.permutaPercentual" value="${p.terreno.permutaPercentual}"></div>
            <div class="field"><label>Permuta, em lotes (R$) — calculado</label><input type="text" class="money-in calc" value="${fmtMoneyInput(p.terreno.permuta)}" readonly></div>
            ` : `
            <div class="field"><label>Permuta, em lotes (R$)</label><input type="text" inputmode="decimal" class="money-in" data-f="terreno.permuta" value="${fmtMoneyInput(p.terreno.permuta)}"></div>
            `}
            <div class="field"><label>Outros custos de aquisição (R$)</label><input type="text" inputmode="decimal" class="money-in" data-f="terreno.outrosCustos" value="${fmtMoneyInput(p.terreno.outrosCustos)}"></div>
          </div>
          <div class="field-row" style="margin-top:10px;">
            <div class="field">
              <label>Permuta no resultado</label>
              <select data-select="terreno.considerarPermuta" data-booltype="1">
                <option value="true" ${p.terreno.considerarPermuta!==false?'selected':''}>Considerar a permuta no resultado</option>
                <option value="false" ${p.terreno.considerarPermuta===false?'selected':''}>Não considerar a permuta</option>
              </select>
            </div>
            <div class="field">
              <label>Compra no fluxo de caixa</label>
              <select data-select="terreno.considerarCompraFluxo" data-booltype="1">
                <option value="true" ${p.terreno.considerarCompraFluxo!==false?'selected':''}>Considerar a compra no fluxo de caixa</option>
                <option value="false" ${p.terreno.considerarCompraFluxo===false?'selected':''}>Não considerar no fluxo</option>
              </select>
            </div>
          </div>
          <div class="footnote" style="margin-top:8px;">Sinal, parcelas e outros custos ${p.terreno.considerarCompraFluxo!==false?'entram no fluxo de caixa':'estão fora do fluxo de caixa, mas continuam no custo total e no resultado'}. A permuta é paga em lotes e não consome caixa${p.terreno.considerarPermuta!==false?', mas reduz o resultado.':'. Desmarcada, ela fica de fora do custo do terreno e não afeta o resultado.'}</div>
        </section>

        <section class="panel ${paineisColapsados['lotes']?'collapsed':''}" id="painel-lotes">
          <h2 class="panel-h" data-panel-id="lotes">Lotes do empreendimento <i class="chevron">▾</i></h2>
          <div class="field-row">
            <div class="field"><label>Total de lotes do empreendimento</label><input type="number" data-f="lotes.totalLotes" value="${p.lotes.totalLotes}"></div>
            <div class="field"><label>Lotes dados em permuta</label><input type="number" data-f="lotes.lotesPermuta" value="${p.lotes.lotesPermuta}"></div>
          </div>
          <div class="hint hint-lotes">Lotes próprios restantes para venda: <strong>${lotesPropios}</strong></div>

          <div class="subhead">Investidores</div>
          <div class="field-row">
            <div class="field"><label>Qtd. lotes vendidos a investidores</label><input type="number" data-f="vendas.investidores.qtd" value="${p.vendas.investidores.qtd}"></div>
            <div class="field"><label>Valor por lote vendido (R$)</label><input type="text" inputmode="decimal" class="money-in" data-f="vendas.investidores.valorLote" value="${fmtMoneyInput(p.vendas.investidores.valorLote)}"></div>
            <div class="field">
              <label>Receita de investidores no resultado</label>
              <select data-select="vendas.investidores.considerarNoResultado" data-booltype="1">
                <option value="false" ${!p.vendas.investidores.considerarNoResultado?'selected':''}>Não considerar (fica de fora)</option>
                <option value="true" ${p.vendas.investidores.considerarNoResultado?'selected':''}>Considerar no resultado do projeto</option>
              </select>

let estimativaParams = {};
let estimativaGrid = [];

function calcularMotorUrbanistico(p, params){
  const areaTotal = Number(p.terreno.area)||0;
  const pctViario = Number(params.pctViario)||0;
  const pctVerdeInst = Number(params.pctVerdeInstitucional)||0;
  const fatorAproveitamento = Number(params.fatorAproveitamento)||100;

  const areaViaria = areaTotal * pctViario/100;
  const areaVerdeInst = areaTotal * pctVerdeInst/100;
  const areaPublicaTotal = areaViaria + areaVerdeInst;
  const alvBruta = Math.max(areaTotal - areaPublicaTotal, 0);
  const alvLiquida = alvBruta * fatorAproveitamento/100;
  const tamanhoLote = Math.max(Number(params.tamanhoLote)||1,1);
  const qtdLotesEstimada = Math.floor(alvLiquida / tamanhoLote);

  return { areaTotal, areaViaria, areaVerdeInst, areaPublicaTotal, alvBruta, alvLiquida, qtdLotesEstimada, perimetro: Number(p.terreno.perimetro)||0 };
}

/* Alguns itens de referência têm mais de uma fonte possível (ex.: SINAPI vs. projetos anteriores).
   Essa função devolve sempre o mesmo formato {taxa, fonte, fonteResumo, composicao}, seja o item
   de fonte única (estrutura antiga, plana) ou de fonte múltipla (com `fontes` e `fonteAtiva`). */
function resolverFonteAtiva(ref){
  if(ref.fontes){
    const chave = ref.fonteAtiva && ref.fontes[ref.fonteAtiva] ? ref.fonteAtiva : Object.keys(ref.fontes)[0];
    return { ...ref.fontes[chave], chaveFonte: chave };
  }
  return { taxa: ref.taxa, fonte: ref.fonte, fonteResumo: ref.fonteResumo, composicao: ref.composicao, chaveFonte: null };
}
const NOMES_FONTE = { sinapi:'SINAPI-CE', projetosAnteriores:'Projetos anteriores', mercado:'Estimativa de mercado' };
function gerarGridEstimativa(p, params, gridAnterior){
  const urb = calcularMotorUrbanistico(p, params);
  const multTopo = MULTIPLICADOR_TOPOGRAFIA.find(m=>m.id===params.topografia) || MULTIPLICADOR_TOPOGRAFIA[0];
  const multDensidade = MULTIPLICADOR_DENSIDADE_VEGETAL.find(m=>m.id===params.densidadeVegetal) || MULTIPLICADOR_DENSIDADE_VEGETAL[0];
  const padrao = OPCOES_PADRAO_EMPREENDIMENTO.find(o=>o.id===params.padrao) || OPCOES_PADRAO_EMPREENDIMENTO[0];
  const pavimento = OPCOES_PAVIMENTACAO.find(o=>o.id===params.pavimentacao) || OPCOES_PAVIMENTACAO[0];

  function acharAnterior(item){ return gridAnterior && gridAnterior.find(l=>l.item===item); }

  const linhas = BANCO_CUSTOS_REFERENCIA.map(ref=>{
    const fonteResolvida = ref.item==='Pavimentação' ? resolverFonteAtiva(pavimento) : resolverFonteAtiva(ref);
    const taxaPadrao = fonteResolvida.taxa;
    const fonte = fonteResolvida.fonte;
    const fonteResumo = fonteResolvida.fonteResumo;
    let base;
    if(ref.tipo==='area_total') base = urb.areaTotal;
    else if(ref.tipo==='area_viaria') base = urb.areaViaria;
    else if(ref.tipo==='area_verde_institucional') base = urb.areaVerdeInst;
    else if(ref.tipo==='por_lote') base = urb.qtdLotesEstimada;
    else if(ref.tipo==='perimetro') base = urb.perimetro;
    else base = 1;
    const mult = (ref.topografia ? multTopo.mult : 1) * (ref.densidadeVegetal ? multDensidade.mult : 1);

    const anterior = acharAnterior(ref.item);
    const editado = anterior ? anterior.editado : false;
    const taxaAtual = editado ? anterior.taxaAtual : taxaPadrao;
    const valor = round2(taxaAtual * base * mult);
    const custoExistente = p.custos.find(c=>c.item.toLowerCase()===ref.item.toLowerCase());
    const valorJaExistente = custoExistente ? Number(custoExistente.valor)||0 : 0;
    const selecionado = anterior ? anterior.selecionado : (valorJaExistente<=0);
    return { item:ref.item, tipo:ref.tipo, topografia:!!ref.topografia, densidadeVegetal:!!ref.densidadeVegetal, fonte, fonteResumo, taxaPadrao, taxaAtual, base, mult, editado, valor, selecionado, valorJaExistente };
  });

  const cubFonte = `CUB/m² Ceará (Sinduscon-CE, R$ ${CUB_CE.toFixed(2)}/m²) × área da edificação`;
  const cubFonteResumo = 'CUB/m² Ceará';
  const anteriorPortaria = acharAnterior('Portaria');
  const editadoPortaria = anteriorPortaria ? anteriorPortaria.editado : false;
  const taxaPortariaPadrao = CUB_CE;
  const taxaPortariaAtual = editadoPortaria ? anteriorPortaria.taxaAtual : taxaPortariaPadrao;
  const custoPortariaExistente = p.custos.find(c=>c.item.toLowerCase()==='portaria');
  const valorJaExistentePortaria = custoPortariaExistente ? Number(custoPortariaExistente.valor)||0 : 0;
  const selecionadoPortaria = anteriorPortaria ? anteriorPortaria.selecionado : (valorJaExistentePortaria<=0);
  linhas.push({ item:'Portaria', tipo:'fixo', topografia:false, fonte:cubFonte, fonteResumo:cubFonteResumo, taxaPadrao:taxaPortariaPadrao, taxaAtual:taxaPortariaAtual, base:padrao.areaPortaria, mult:1, editado:editadoPortaria, valor: round2(taxaPortariaAtual*padrao.areaPortaria), selecionado:selecionadoPortaria, valorJaExistente: valorJaExistentePortaria });

  if(padrao.areaClube>0){
    const anteriorClube = acharAnterior('Clube');
    const editadoClube = anteriorClube ? anteriorClube.editado : false;
    const taxaClubePadrao = CUB_CE;
    const taxaClubeAtual = editadoClube ? anteriorClube.taxaAtual : taxaClubePadrao;
    const custoClubeExistente = p.custos.find(c=>c.item.toLowerCase()==='clube');
    const valorJaExistenteClube = custoClubeExistente ? Number(custoClubeExistente.valor)||0 : 0;
    const selecionadoClube = anteriorClube ? anteriorClube.selecionado : (valorJaExistenteClube<=0);
    linhas.push({ item:'Clube', tipo:'fixo', topografia:false, fonte:cubFonte, fonteResumo:cubFonteResumo, taxaPadrao:taxaClubePadrao, taxaAtual:taxaClubeAtual, base:padrao.areaClube, mult:1, editado:editadoClube, valor: round2(taxaClubeAtual*padrao.areaClube), selecionado:selecionadoClube, valorJaExistente: valorJaExistenteClube });
  }
  return linhas;
}

function abrirModalEstimativa(){
  const p = state.atual;
  if(!p.terreno.area || p.terreno.area<=0){
    abrirModalTerrenoRequisito();
    return;
  }
  const padroesFabrica = {
    topografia: 'plano',
    densidadeVegetal: 'pouco_denso',
    tamanhoLote: 200,
    padrao: 'medio',
    pavimentacao: 'bloquete',
    pctViario: URBANISTICO_PADRAO.pctViario,
    pctVerdeInstitucional: URBANISTICO_PADRAO.pctVerdeInstitucional,
    fatorAproveitamento: URBANISTICO_PADRAO.fatorAproveitamento,
  };
  estimativaParams = p.autoParams ? { ...padroesFabrica, ...p.autoParams } : padroesFabrica;
  estimativaAplicarLotes = !(Number(p.lotes.totalLotes)>0);
  estimativaGrid = gerarGridEstimativa(p, estimativaParams);
  renderModalEstimativa();
}
function abrirModalTerrenoRequisito(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay modal-overlay-terreno-requisito';
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:380px;">
      <h2 style="font-size:16px;margin:0 0 6px;">Antes de gerar o orçamento</h2>
      <p class="footnote" style="margin:0 0 14px;">O Auto precisa saber a área do terreno pra calcular a divisão da gleba e ratear os custos. Informe abaixo pra continuar — isso vai preencher o campo de área lá no painel de Terreno também.</p>
      <div class="field" style="margin-bottom:12px;">
        <label>Área do terreno (m²)</label>
        <input type="number" id="reqArea" value="${state.atual.terreno.area||''}" placeholder="Ex.: 50000">
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Perímetro (m)</label>
        <input type="number" id="reqPerimetro" value="${state.atual.terreno.perimetro||''}" placeholder="Calculado automático">
      </div>
      <div class="footnote" id="reqAviso" style="margin-bottom:10px;color:var(--bad);display:none;"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="ghost" id="reqCancelar">Cancelar</button>
        <button class="primary" id="reqContinuar">Continuar →</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const areaInput = overlay.querySelector('#reqArea');
  const perimetroInput = overlay.querySelector('#reqPerimetro');
  areaInput.addEventListener('input', ()=>{
    const a = Number(areaInput.value)||0;
    if(a>0) perimetroInput.value = Math.round(4*Math.sqrt(a));
  });
  overlay.querySelector('#reqCancelar').addEventListener('click', ()=>overlay.remove());
  overlay.querySelector('#reqContinuar').addEventListener('click', ()=>{
    const a = Number(areaInput.value)||0;
    if(a<=0){
      const aviso = overlay.querySelector('#reqAviso');
      aviso.textContent = 'Informe uma área maior que zero pra continuar.';
      aviso.style.display = 'block';
      return;
    }
    state.atual.terreno.area = a;
    state.atual.terreno.perimetro = Number(perimetroInput.value)||Math.round(4*Math.sqrt(a));
    salvarProjeto(state.atual);
    overlay.remove();
    renderFull();
    abrirModalEstimativa();
  });
}

function listaReferenciaComposicoes(){
  const linhas = [];
  BANCO_CUSTOS_REFERENCIA.forEach((r,i)=>{
    if(r.item==='Pavimentação') return;
    const ativo = resolverFonteAtiva(r);
    linhas.push({
      chave:`custo:${i}`, titulo:r.item, taxa:ativo.taxa,
      tag: r.fontes ? (NOMES_FONTE[ativo.chaveFonte] || ativo.chaveFonte) : ((r.composicao && r.composicao.length) ? 'SINAPI' : 'Mercado'),
      temVarias: !!r.fontes,
    });
  });
  OPCOES_PAVIMENTACAO.forEach((o,i)=>{
    const ativo = resolverFonteAtiva(o);
    linhas.push({ chave:`pavimento:${i}`, titulo:`Pavimentação — ${o.nome}`, taxa:ativo.taxa,
      tag: o.fontes ? (NOMES_FONTE[ativo.chaveFonte] || ativo.chaveFonte) : 'SINAPI',
      temVarias: !!o.fontes });
  });
  linhas.push({ chave:'cub', titulo:'CUB/m² Ceará (usado em Portaria e Clube)', taxa:CUB_CE, tag:'CUB-CE', temVarias:false });
  return linhas;
}
function resolverReferenciaPorChave(chave){
  if(chave==='cub') return { tipo:'cub' };
  const [tipo, idxStr] = chave.split(':');
  const idx = Number(idxStr);
  if(tipo==='custo') return { tipo:'custo', idx, obj: BANCO_CUSTOS_REFERENCIA[idx] };
  if(tipo==='pavimento') return { tipo:'pavimento', idx, obj: OPCOES_PAVIMENTACAO[idx] };
  return null;
}

        else if(campo==='quantidade'){ const n = parseFloat(v.replace(',','.')); if(!isNaN(n) && isFinite(n) && String(n)===v.replace(',','.').trim()) v = n; }
        composicaoDetalheEdicao.composicao[idx][campo] = v;
        atualizarSomaAutoComposicao();
      });
